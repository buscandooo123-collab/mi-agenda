<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Mi Agenda Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);min-height:100vh;color:#f8fafc;overflow-x:hidden}
        
        /* LOGIN */
        #login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0a1e 0%,#1e1b4b 50%,#0f0a1e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;padding:2rem}
        #login-screen.hidden{display:none}
        .login-titulo{font-family:'Satisfy',cursive;font-size:2.5rem;margin-bottom:0.5rem;text-shadow:2px 2px 20px rgba(99,102,241,0.5)}
        .login-subtitulo{color:#a5b4fc;margin-bottom:2rem;font-size:0.95rem}
        .login-form{width:100%;max-width:320px}
        .login-input{width:100%;padding:1rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:12px;color:#f8fafc;font-size:1rem;margin-bottom:1rem;outline:none}
        .login-input:focus{border-color:#6366f1}
        .login-btn{width:100%;padding:1rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:white;font-size:1rem;font-weight:700;cursor:pointer}
        .login-btn:disabled{opacity:0.6}
        .login-error{color:#f87171;font-size:0.9rem;margin-bottom:1rem;text-align:center;min-height:1.5rem}
        .login-registro{margin-top:1.5rem;color:#94a3b8;font-size:0.9rem;text-align:center}
        .login-registro a{color:#a5b4fc;cursor:pointer;text-decoration:underline}
        
        /* PATRON */
        #patron-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0a1e 0%,#1e1b4b 50%,#0f0a1e 100%);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:2rem}
        #patron-screen.visible{display:flex}
        .patron-titulo{font-family:'Satisfy',cursive;font-size:2.2rem;margin-bottom:0.5rem}
        .patron-subtitulo{color:#a5b4fc;margin-bottom:2rem}
        .patron-mensaje{color:#fbbf24;margin-bottom:1rem;min-height:1.5rem;font-weight:600}
        .patron-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;padding:1.5rem;background:rgba(30,41,59,0.5);border-radius:24px;border:1px solid rgba(99,102,241,0.2);touch-action:none;position:relative}
        .patron-punto{width:70px;height:70px;border-radius:50%;background:rgba(99,102,241,0.2);border:3px solid rgba(99,102,241,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.15s}
        .patron-punto.activo{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:#a5b4fc;box-shadow:0 0 20px rgba(99,102,241,0.6);transform:scale(1.1)}
        .patron-punto-centro{width:20px;height:20px;border-radius:50%;background:rgba(165,180,252,0.5)}
        .patron-punto.activo .patron-punto-centro{background:white}
        .patron-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
        .btn-patron{padding:0.75rem 1.5rem;border-radius:12px;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;background:rgba(71,85,105,0.5);color:#cbd5e1;margin-top:2rem}
        
        /* APP */
        #app{display:none;min-height:100vh}
        #app.visible{display:block}
        
        /* TOP BAR */
        .topbar{display:flex;align-items:center;padding:1rem;background:rgba(15,23,42,0.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
        .menu-btn{width:44px;height:44px;background:none;border:none;color:#f8fafc;font-size:1.5rem;cursor:pointer;border-radius:12px}
        .menu-btn:hover{background:rgba(99,102,241,0.2)}
        .topbar-title{flex:1;text-align:center;font-family:'Satisfy',cursive;font-size:1.8rem}
        .lock-btn{width:44px;height:44px;background:none;border:none;color:#f8fafc;font-size:1.3rem;cursor:pointer;border-radius:12px}
        
        /* SIDEBAR */
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;visibility:hidden;transition:all 0.3s}
        .sidebar-overlay.visible{opacity:1;visibility:visible}
        .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);z-index:201;transition:left 0.3s;display:flex;flex-direction:column}
        .sidebar.visible{left:0}
        .sidebar-header{padding:1.5rem;border-bottom:1px solid rgba(99,102,241,0.2)}
        .sidebar-header h2{font-family:'Satisfy',cursive;font-size:1.8rem;margin-bottom:0.25rem}
        .sidebar-header p{color:#64748b;font-size:0.8rem}
        .sidebar-menu{flex:1;overflow-y:auto;padding:1rem}
        .sidebar-item{display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1rem;border-radius:12px;cursor:pointer;margin-bottom:0.5rem;transition:all 0.2s;border:2px solid transparent}
        .sidebar-item:hover{background:rgba(99,102,241,0.1)}
        .sidebar-item.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent}
        .sidebar-item .icon{font-size:1.3rem}
        .sidebar-item .name{flex:1;font-weight:600}
        .sidebar-item .count{background:rgba(255,255,255,0.2);padding:0.2rem 0.6rem;border-radius:10px;font-size:0.75rem}
        .sidebar-divider{height:1px;background:rgba(99,102,241,0.2);margin:1rem 0}
        .sidebar-item.add{border:2px dashed rgba(34,197,94,0.4);color:#4ade80}
        .sidebar-item.add:hover{background:rgba(34,197,94,0.1)}
        .sidebar-footer{padding:1rem;border-top:1px solid rgba(99,102,241,0.2)}
        .sidebar-footer p{color:#64748b;font-size:0.75rem;text-align:center}
        
        /* CONTENT */
        .content{padding:1rem;padding-bottom:100px}
        .content-header{margin-bottom:1rem}
        .content-header h1{font-size:1.5rem;display:flex;align-items:center;gap:0.5rem}
        .content-header p{color:#94a3b8;font-size:0.85rem}
        
        /* STATS BAR (para pagos) */
        .stats-bar{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem}
        .stat-card{background:rgba(30,41,59,0.8);border-radius:16px;padding:1rem;border:1px solid rgba(99,102,241,0.2)}
        .stat-card.total{background:linear-gradient(135deg,rgba(99,102,241,0.3),rgba(139,92,246,0.3))}
        .stat-card.pendiente{background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(249,115,22,0.2))}
        .stat-label{color:#94a3b8;font-size:0.75rem;margin-bottom:0.25rem}
        .stat-value{font-size:1.4rem;font-weight:800}
        
        /* ADD BUTTON */
        .btn-add{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:50%;color:white;font-size:1.8rem;cursor:pointer;box-shadow:0 4px 20px rgba(99,102,241,0.5);z-index:50;display:flex;align-items:center;justify-content:center}
        
        /* ITEMS */
        .item-list{display:flex;flex-direction:column;gap:0.75rem}
        .item-empty{text-align:center;padding:3rem 1rem;color:#64748b}
        .item-empty .icon{font-size:3rem;margin-bottom:0.5rem;opacity:0.5}
        
        /* PAGO CARD */
        .pago-card{background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:16px;padding:1rem;border-left:4px solid #6366f1;position:relative}
        .pago-card.urgente{border-left-color:#ef4444;background:linear-gradient(145deg,rgba(127,29,29,0.3),rgba(15,23,42,0.9))}
        .pago-card.proximo{border-left-color:#f59e0b}
        .pago-card.pagado{opacity:0.6;border-left-color:#22c55e}
        .pago-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:0.5rem}
        .pago-titulo{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:0.5rem}
        .pago-monto{font-size:1.1rem;font-weight:800;color:#a5b4fc}
        .pago-dias{display:inline-block;padding:0.25rem 0.6rem;border-radius:10px;font-size:0.7rem;font-weight:700}
        .dias-hoy{background:#ef4444}
        .dias-pronto{background:#f59e0b}
        .dias-bien{background:#6366f1}
        .dias-pagado{background:#22c55e}
        .pago-info{color:#94a3b8;font-size:0.8rem;margin-bottom:0.5rem}
        .pago-cuenta{background:rgba(15,23,42,0.5);padding:0.5rem;border-radius:8px;margin-bottom:0.5rem;cursor:pointer}
        .pago-cuenta-label{color:#64748b;font-size:0.65rem}
        .pago-cuenta-num{font-family:monospace;font-size:0.85rem}
        .pago-notas{color:#94a3b8;font-size:0.8rem;font-style:italic;background:rgba(99,102,241,0.1);padding:0.4rem 0.6rem;border-radius:6px;margin-bottom:0.5rem}
        .pago-actions{display:flex;gap:0.5rem;flex-wrap:wrap}
        .pago-btn{padding:0.4rem 0.8rem;border-radius:8px;font-size:0.75rem;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;gap:0.3rem}
        .pago-btn-pagar{background:#22c55e;color:white}
        .pago-btn-historial{background:rgba(99,102,241,0.2);color:#a5b4fc}
        .pago-btn-edit{background:rgba(251,191,36,0.2);color:#fbbf24}
        .pago-btn-del{background:rgba(239,68,68,0.15);color:#fca5a5}
        
        /* NOTA CARD */
        .nota-card{background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:16px;padding:1rem;border-left:4px solid #ec4899}
        .nota-titulo{font-size:1rem;font-weight:700;margin-bottom:0.5rem}
        .nota-desc{color:#94a3b8;font-size:0.85rem;margin-bottom:0.75rem;white-space:pre-wrap}
        .nota-fecha{color:#64748b;font-size:0.7rem;margin-bottom:0.5rem}
        .nota-actions{display:flex;gap:0.5rem}
        
        /* PROYECTO CARD */
        .proyecto-card{background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:16px;padding:1rem;border-left:4px solid #8b5cf6}
        .proyecto-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:0.5rem}
        .proyecto-titulo{font-size:1rem;font-weight:700}
        .proyecto-estado{padding:0.25rem 0.6rem;border-radius:10px;font-size:0.7rem;font-weight:700}
        .estado-pendiente{background:#f59e0b}
        .estado-progreso{background:#3b82f6}
        .estado-completado{background:#22c55e}
        .proyecto-desc{color:#94a3b8;font-size:0.85rem;margin-bottom:0.75rem}
        .proyecto-actions{display:flex;gap:0.5rem}
        
        /* TAREA CARD */
        .tarea-card{background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:16px;padding:1rem;display:flex;align-items:center;gap:1rem}
        .tarea-card.completada{opacity:0.6}
        .tarea-check{width:28px;height:28px;border-radius:50%;border:3px solid #6366f1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .tarea-check.checked{background:#22c55e;border-color:#22c55e}
        .tarea-content{flex:1}
        .tarea-titulo{font-size:0.95rem;font-weight:600}
        .tarea-card.completada .tarea-titulo{text-decoration:line-through}
        .tarea-fecha{color:#94a3b8;font-size:0.75rem}
        .tarea-actions{display:flex;gap:0.25rem}
        .tarea-btn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;font-size:0.8rem}
        
        /* MODAL */
        .modal{position:fixed;inset:0;background:rgba(15,23,42,0.95);display:none;align-items:center;justify-content:center;z-index:500;padding:1rem}
        .modal.visible{display:flex}
        .modal-content{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:20px;padding:1.25rem;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;border:1px solid rgba(99,102,241,0.2)}
        .modal h2{font-size:1.2rem;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem}
        .form-group{margin-bottom:1rem}
        .form-label{color:#94a3b8;font-size:0.8rem;display:block;margin-bottom:0.3rem;font-weight:600}
        .form-input{width:100%;padding:0.75rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:10px;color:#f8fafc;font-size:0.95rem;outline:none}
        .form-input:focus{border-color:#6366f1}
        .form-select{width:100%;padding:0.75rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:10px;color:#f8fafc;font-size:0.95rem;outline:none}
        textarea.form-input{resize:none;min-height:80px}
        .icon-grid{display:flex;flex-wrap:wrap;gap:0.4rem}
        .icon-btn{width:40px;height:40px;border-radius:10px;border:2px solid transparent;background:rgba(30,41,59,0.5);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .icon-btn.active{border-color:#6366f1;background:rgba(99,102,241,0.2)}
        .tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
        .tipo-btn{padding:1rem;border-radius:12px;border:2px solid rgba(99,102,241,0.3);background:rgba(30,41,59,0.5);cursor:pointer;text-align:center;transition:all 0.2s}
        .tipo-btn.active{border-color:#6366f1;background:rgba(99,102,241,0.2)}
        .tipo-btn .icon{font-size:1.5rem;margin-bottom:0.25rem}
        .tipo-btn .name{font-size:0.8rem;font-weight:600}
        .modal-actions{display:flex;gap:0.5rem;margin-top:1rem}
        .modal-btn{flex:1;padding:0.75rem;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer}
        .btn-cancel{background:rgba(71,85,105,0.5);color:#cbd5e1}
        .btn-save{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
        .btn-delete{background:rgba(239,68,68,0.2);color:#fca5a5}
        
        /* HISTORIAL MODAL */
        .historial-list{max-height:300px;overflow-y:auto}
        .historial-item{display:flex;justify-content:space-between;padding:0.75rem;background:rgba(30,41,59,0.5);border-radius:8px;margin-bottom:0.5rem}
        .historial-fecha{color:#94a3b8;font-size:0.85rem}
        .historial-monto{font-weight:700;color:#22c55e}
        
        /* TOAST */
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#f8fafc;padding:0.75rem 1.5rem;border-radius:12px;font-weight:600;font-size:0.9rem;transition:transform 0.3s;z-index:600;white-space:nowrap}
        .toast.visible{transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login-screen">
        <h1 class="login-titulo">🔐 Mi Agenda</h1>
        <p class="login-subtitulo">Inicia sesión para acceder</p>
        <div class="login-form">
            <input type="email" class="login-input" id="login-email" placeholder="Correo electrónico">
            <input type="password" class="login-input" id="login-password" placeholder="Contraseña">
            <p class="login-error" id="login-error"></p>
            <button class="login-btn" onclick="iniciarSesion()">Iniciar sesión</button>
            <p class="login-registro">¿Primera vez? <a onclick="registrarse()">Crear cuenta</a></p>
        </div>
    </div>

    <!-- PATRON -->
    <div id="patron-screen">
        <h1 class="patron-titulo">🔐 Mi Agenda</h1>
        <p class="patron-subtitulo" id="patron-modo">Dibuja tu patrón</p>
        <p class="patron-mensaje" id="patron-mensaje"></p>
        <div class="patron-grid" id="patron-grid">
            <canvas class="patron-canvas" id="patron-canvas"></canvas>
            <div class="patron-punto" data-index="0"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="1"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="2"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="3"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="4"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="5"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="6"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="7"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="8"><div class="patron-punto-centro"></div></div>
        </div>
        <button class="btn-patron" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <!-- APP -->
    <div id="app">
        <div class="topbar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <span class="topbar-title">Mi Agenda</span>
            <button class="lock-btn" onclick="bloquearApp()">🔒</button>
        </div>

        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Mi Agenda</h2>
                <p id="sidebar-email"></p>
            </div>
            <div class="sidebar-menu" id="sidebar-menu"></div>
            <div class="sidebar-footer">
                <p>📅 <span id="fecha-hoy"></span></p>
            </div>
        </div>

        <div class="content" id="content"></div>
        <button class="btn-add" onclick="abrirModalItem()">+</button>
    </div>

    <!-- MODAL ITEM -->
    <div class="modal" id="modal-item">
        <div class="modal-content" id="modal-item-content"></div>
    </div>

    <!-- MODAL TAB -->
    <div class="modal" id="modal-tab">
        <div class="modal-content">
            <h2 id="modal-tab-titulo">📁 Nueva Categoría</h2>
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-input" id="tab-nombre" placeholder="Ej: Trabajo">
            </div>
            <div class="form-group">
                <label class="form-label">Icono</label>
                <div class="icon-grid" id="tab-icon-grid"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Tipo</label>
                <div class="tipo-grid">
                    <div class="tipo-btn" data-tipo="pagos" onclick="selTipo('pagos')"><div class="icon">💳</div><div class="name">Pagos</div></div>
                    <div class="tipo-btn" data-tipo="notas" onclick="selTipo('notas')"><div class="icon">📋</div><div class="name">Notas</div></div>
                    <div class="tipo-btn" data-tipo="proyectos" onclick="selTipo('proyectos')"><div class="icon">💼</div><div class="name">Proyectos</div></div>
                    <div class="tipo-btn" data-tipo="tareas" onclick="selTipo('tareas')"><div class="icon">✅</div><div class="name">Tareas</div></div>
                </div>
            </div>
            <div class="modal-actions" id="modal-tab-actions"></div>
        </div>
    </div>

    <!-- MODAL HISTORIAL -->
    <div class="modal" id="modal-historial">
        <div class="modal-content">
            <h2>📊 Historial de Pagos</h2>
            <div class="historial-list" id="historial-list"></div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="cerrarHistorial()">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiFwURHHCwGg6_3scyUxO43ib6kH-y8AM",
            authDomain: "agenda-pendientes-y-proyectos.firebaseapp.com",
            projectId: "agenda-pendientes-y-proyectos",
            storageBucket: "agenda-pendientes-y-proyectos.firebasestorage.app",
            messagingSenderId: "534286151036",
            appId: "1:534286151036:web:2114bf9b316ae7262688f9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let usuario = null, tabs = [], tabActiva = null, items = [], editandoItem = null, editandoTab = null;
        let tabIconoSel = '💳', tabTipoSel = 'pagos';
        const iconosTabs = ['💳','📋','💼','✅','🏠','🚗','💰','📚','🎯','🛒','💊','📱','🌐','✈️','🍔','👕','🏥','⚡','🎮','📺'];

        // AUTH
        auth.onAuthStateChanged(u => {
            if (u) { usuario = u; document.getElementById('login-screen').classList.add('hidden'); document.getElementById('sidebar-email').textContent = u.email; initPatron(); }
            else { usuario = null; document.getElementById('login-screen').classList.remove('hidden'); document.getElementById('patron-screen').classList.remove('visible'); document.getElementById('app').classList.remove('visible'); }
        });

        async function iniciarSesion() {
            const e = document.getElementById('login-email').value.trim(), p = document.getElementById('login-password').value;
            if (!e || !p) { document.getElementById('login-error').textContent = 'Completa los campos'; return; }
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch (err) { document.getElementById('login-error').textContent = err.code === 'auth/user-not-found' ? 'Usuario no existe' : 'Contraseña incorrecta'; }
        }

        async function registrarse() {
            const e = document.getElementById('login-email').value.trim(), p = document.getElementById('login-password').value;
            if (!e || !p) { document.getElementById('login-error').textContent = 'Completa los campos'; return; }
            if (p.length < 6) { document.getElementById('login-error').textContent = 'Mínimo 6 caracteres'; return; }
            try { await auth.createUserWithEmailAndPassword(e, p); } 
            catch (err) { document.getElementById('login-error').textContent = err.code === 'auth/email-already-in-use' ? 'Correo ya existe' : 'Error'; }
        }

        function cerrarSesion() { auth.signOut(); }

        // PATRON
        let patronGuardado = localStorage.getItem('patron_agenda'), patronActual = [], dibujando = false, modoConfig, patronTemp = null, patronCtx;
        const puntos = document.querySelectorAll('.patron-punto'), patronGrid = document.getElementById('patron-grid'), patronCanvas = document.getElementById('patron-canvas');

        function initPatron() {
            document.getElementById('patron-screen').classList.add('visible');
            setTimeout(() => { const r = patronGrid.getBoundingClientRect(); patronCanvas.width = r.width; patronCanvas.height = r.height; patronCtx = patronCanvas.getContext('2d'); }, 100);
            patronGuardado = localStorage.getItem('patron_agenda'); modoConfig = !patronGuardado; patronTemp = null;
            document.getElementById('patron-modo').textContent = modoConfig ? 'Crea tu patrón (4+ puntos)' : 'Dibuja tu patrón';
            document.getElementById('patron-mensaje').textContent = modoConfig ? 'Conecta al menos 4 puntos' : '';
            patronGrid.onmousedown = patronGrid.ontouchstart = startDraw;
            patronGrid.onmousemove = patronGrid.ontouchmove = moveDraw;
            patronGrid.onmouseup = patronGrid.ontouchend = patronGrid.onmouseleave = endDraw;
        }

        function getCoords(e) { const r = patronGrid.getBoundingClientRect(); return e.touches ? {x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top} : {x: e.clientX - r.left, y: e.clientY - r.top}; }
        function getPunto(x, y) { for (let p of puntos) { const r = p.getBoundingClientRect(), gr = patronGrid.getBoundingClientRect(); if (Math.sqrt((x-(r.left-gr.left+r.width/2))**2 + (y-(r.top-gr.top+r.height/2))**2) < 40) return parseInt(p.dataset.index); } return -1; }
        function getCentro(i) { const p = puntos[i], r = p.getBoundingClientRect(), gr = patronGrid.getBoundingClientRect(); return {x: r.left-gr.left+r.width/2, y: r.top-gr.top+r.height/2}; }
        function startDraw(e) { e.preventDefault(); dibujando = true; patronActual = []; if(patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); const c = getCoords(e), pt = getPunto(c.x, c.y); if (pt >= 0) { patronActual.push(pt); puntos[pt].classList.add('activo'); } }
        function moveDraw(e) { if (!dibujando) return; e.preventDefault(); const c = getCoords(e), pt = getPunto(c.x, c.y); if (pt >= 0 && !patronActual.includes(pt)) { patronActual.push(pt); puntos[pt].classList.add('activo'); } drawLines(c); }
        function endDraw() { if (!dibujando) return; dibujando = false; drawLines(); validatePatron(); }
        function drawLines(cur=null) { if(!patronCtx) return; patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); if(!patronActual.length) return; patronCtx.strokeStyle='#6366f1'; patronCtx.lineWidth=4; patronCtx.lineCap='round'; patronCtx.beginPath(); const s=getCentro(patronActual[0]); patronCtx.moveTo(s.x,s.y); for(let i=1;i<patronActual.length;i++){const c=getCentro(patronActual[i]);patronCtx.lineTo(c.x,c.y);} if(cur&&dibujando)patronCtx.lineTo(cur.x,cur.y); patronCtx.stroke(); }
        
        function validatePatron() {
            const msg = document.getElementById('patron-mensaje');
            if (modoConfig) {
                if (patronActual.length >= 4) {
                    if (!patronTemp) { patronTemp = patronActual.join('-'); msg.textContent = '✓ Dibújalo de nuevo'; msg.style.color = '#4ade80'; setTimeout(() => { patronActual = []; if(patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); }, 1000); }
                    else if (patronActual.join('-') === patronTemp) { localStorage.setItem('patron_agenda', patronTemp); msg.textContent = '✓ ¡Guardado!'; msg.style.color = '#4ade80'; setTimeout(unlock, 500); }
                    else { msg.textContent = '✗ No coinciden'; msg.style.color = '#f87171'; patronTemp = null; setTimeout(() => { patronActual = []; if(patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); msg.textContent = 'Conecta al menos 4 puntos'; msg.style.color = '#fbbf24'; }, 1500); }
                } else { msg.textContent = 'Mínimo 4 puntos'; msg.style.color = '#fbbf24'; }
            } else {
                if (patronActual.join('-') === patronGuardado) { msg.textContent = '✓ Desbloqueado'; msg.style.color = '#4ade80'; setTimeout(unlock, 300); }
                else { msg.textContent = '✗ Incorrecto'; msg.style.color = '#f87171'; setTimeout(() => { patronActual = []; if(patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); msg.textContent = ''; }, 1000); }
            }
        }

        function unlock() { document.getElementById('patron-screen').classList.remove('visible'); document.getElementById('app').classList.add('visible'); cargarTabs(); mostrarFecha(); }
        function bloquearApp() { document.getElementById('patron-screen').classList.add('visible'); document.getElementById('app').classList.remove('visible'); patronActual = []; if(patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); document.getElementById('patron-mensaje').textContent = ''; closeSidebar(); }

        // SIDEBAR
        function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('visible'); document.querySelector('.sidebar-overlay').classList.toggle('visible'); }
        function closeSidebar() { document.querySelector('.sidebar').classList.remove('visible'); document.querySelector('.sidebar-overlay').classList.remove('visible'); }

        // TABS
        async function cargarTabs() {
            const snap = await db.collection('tabs').where('usuarioId', '==', usuario.uid).get();
            tabs = []; snap.forEach(d => tabs.push({id: d.id, ...d.data()}));
            tabs.sort((a,b) => (a.orden||0) - (b.orden||0));
            if (tabs.length === 0) {
                await db.collection('tabs').add({nombre: 'Pagos', icono: '💳', tipo: 'pagos', orden: 0, usuarioId: usuario.uid});
                await db.collection('tabs').add({nombre: 'Notas', icono: '📋', tipo: 'notas', orden: 1, usuarioId: usuario.uid});
                await db.collection('tabs').add({nombre: 'Proyectos', icono: '💼', tipo: 'proyectos', orden: 2, usuarioId: usuario.uid});
                return cargarTabs();
            }
            if (!tabActiva || !tabs.find(t => t.id === tabActiva)) tabActiva = tabs[0].id;
            renderSidebar();
            cargarItems();
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            menu.innerHTML = tabs.map(t => `
                <div class="sidebar-item ${t.id === tabActiva ? 'active' : ''}" onclick="selTab('${t.id}')" oncontextmenu="event.preventDefault();editTab('${t.id}')">
                    <span class="icon">${t.icono}</span>
                    <span class="name">${t.nombre}</span>
                </div>
            `).join('') + `
                <div class="sidebar-divider"></div>
                <div class="sidebar-item add" onclick="abrirModalTab()">
                    <span class="icon">➕</span>
                    <span class="name">Nueva categoría</span>
                </div>
            `;
        }

        function selTab(id) { tabActiva = id; renderSidebar(); cargarItems(); closeSidebar(); }

        function abrirModalTab(tab = null) {
            editandoTab = tab;
            document.getElementById('modal-tab-titulo').textContent = tab ? '✏️ Editar Categoría' : '📁 Nueva Categoría';
            document.getElementById('tab-nombre').value = tab ? tab.nombre : '';
            tabIconoSel = tab ? tab.icono : '💳';
            tabTipoSel = tab ? tab.tipo : 'pagos';
            renderTabIconos();
            renderTipos();
            document.getElementById('modal-tab-actions').innerHTML = `
                <button class="modal-btn btn-cancel" onclick="cerrarModalTab()">Cancelar</button>
                ${tab ? `<button class="modal-btn btn-delete" onclick="eliminarTab()">🗑️</button>` : ''}
                <button class="modal-btn btn-save" onclick="guardarTab()">Guardar</button>
            `;
            document.getElementById('modal-tab').classList.add('visible');
            closeSidebar();
        }

        function cerrarModalTab() { document.getElementById('modal-tab').classList.remove('visible'); }
        function editTab(id) { abrirModalTab(tabs.find(t => t.id === id)); }

        function renderTabIconos() {
            document.getElementById('tab-icon-grid').innerHTML = iconosTabs.map(i => `<button type="button" class="icon-btn ${i === tabIconoSel ? 'active' : ''}" onclick="tabIconoSel='${i}';renderTabIconos()">${i}</button>`).join('');
        }

        function selTipo(t) { tabTipoSel = t; renderTipos(); }
        function renderTipos() { document.querySelectorAll('.tipo-btn').forEach(b => b.classList.toggle('active', b.dataset.tipo === tabTipoSel)); }

        async function guardarTab() {
            const nombre = document.getElementById('tab-nombre').value.trim();
            if (!nombre) { toast('⚠️ Escribe un nombre'); return; }
            if (editandoTab) {
                await db.collection('tabs').doc(editandoTab.id).update({nombre, icono: tabIconoSel, tipo: tabTipoSel});
            } else {
                await db.collection('tabs').add({nombre, icono: tabIconoSel, tipo: tabTipoSel, orden: tabs.length, usuarioId: usuario.uid});
            }
            cerrarModalTab(); cargarTabs(); toast('✓ Guardado');
        }

        async function eliminarTab() {
            if (tabs.length <= 1) { toast('⚠️ Necesitas al menos 1'); return; }
            if (!confirm('¿Eliminar categoría y todo su contenido?')) return;
            const snap = await db.collection('items').where('tabId', '==', editandoTab.id).get();
            const batch = db.batch();
            snap.forEach(d => batch.delete(d.ref));
            batch.delete(db.collection('tabs').doc(editandoTab.id));
            await batch.commit();
            tabActiva = null;
            cerrarModalTab(); cargarTabs(); toast('✓ Eliminado');
        }

        // ITEMS
        async function cargarItems() {
            if (!tabActiva) return;
            const snap = await db.collection('items').where('tabId', '==', tabActiva).get();
            items = []; snap.forEach(d => items.push({id: d.id, ...d.data()}));
            renderContent();
        }

        function getTabActiva() { return tabs.find(t => t.id === tabActiva); }

        function renderContent() {
            const tab = getTabActiva();
            if (!tab) return;
            const content = document.getElementById('content');
            
            let header = `<div class="content-header"><h1>${tab.icono} ${tab.nombre}</h1></div>`;
            let stats = '';
            let list = '';

            if (tab.tipo === 'pagos') {
                const hoy = new Date().getDate();
                const totalMes = items.reduce((s, i) => s + (parseFloat(i.monto) || 0), 0);
                const pendientes = items.filter(i => !i.pagadoEsteMes);
                const totalPendiente = pendientes.reduce((s, i) => s + (parseFloat(i.monto) || 0), 0);
                
                stats = `<div class="stats-bar">
                    <div class="stat-card total"><div class="stat-label">Total mensual</div><div class="stat-value">$${totalMes.toLocaleString()}</div></div>
                    <div class="stat-card pendiente"><div class="stat-label">Pendiente</div><div class="stat-value">$${totalPendiente.toLocaleString()}</div></div>
                </div>`;

                const sorted = [...items].sort((a, b) => diasRestantes(a.dia) - diasRestantes(b.dia));
                list = sorted.length ? sorted.map(i => renderPago(i)).join('') : '<div class="item-empty"><div class="icon">💳</div><p>Sin pagos registrados</p></div>';
            } else if (tab.tipo === 'notas') {
                const sorted = [...items].sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0));
                list = sorted.length ? sorted.map(i => renderNota(i)).join('') : '<div class="item-empty"><div class="icon">📋</div><p>Sin notas</p></div>';
            } else if (tab.tipo === 'proyectos') {
                const orden = {pendiente: 0, progreso: 1, completado: 2};
                const sorted = [...items].sort((a, b) => orden[a.estado || 'pendiente'] - orden[b.estado || 'pendiente']);
                list = sorted.length ? sorted.map(i => renderProyecto(i)).join('') : '<div class="item-empty"><div class="icon">💼</div><p>Sin proyectos</p></div>';
            } else if (tab.tipo === 'tareas') {
                const sorted = [...items].sort((a, b) => (a.completada ? 1 : 0) - (b.completada ? 1 : 0));
                list = sorted.length ? sorted.map(i => renderTarea(i)).join('') : '<div class="item-empty"><div class="icon">✅</div><p>Sin tareas</p></div>';
            }

            content.innerHTML = header + stats + `<div class="item-list">${list}</div>`;
        }

        function diasRestantes(dia) {
            const hoy = new Date(), d = hoy.getDate(), m = hoy.getMonth(), a = hoy.getFullYear();
            let f = new Date(a, m, dia);
            if (dia <= d) f = new Date(a, m + 1, dia);
            return Math.ceil((f - hoy) / (1000*60*60*24));
        }

        function renderPago(p) {
            const dr = diasRestantes(p.dia);
            let clase = '', badge = '';
            if (p.pagadoEsteMes) { clase = 'pagado'; badge = '<span class="pago-dias dias-pagado">✓ Pagado</span>'; }
            else if (dr <= 0) { clase = 'urgente'; badge = '<span class="pago-dias dias-hoy">¡HOY!</span>'; }
            else if (dr <= 3) { clase = 'proximo'; badge = `<span class="pago-dias dias-pronto">${dr} días</span>`; }
            else { badge = `<span class="pago-dias dias-bien">${dr} días</span>`; }
            
            return `<div class="pago-card ${clase}">
                <div class="pago-header">
                    <span class="pago-titulo">${p.icono || '💳'} ${p.nombre}</span>
                    <span class="pago-monto">$${parseFloat(p.monto || 0).toLocaleString()}</span>
                </div>
                <div class="pago-info">📅 Día ${p.dia} de cada mes ${badge}</div>
                ${p.cuenta ? `<div class="pago-cuenta" onclick="copiar('${p.cuenta}')"><div class="pago-cuenta-label">CUENTA/REFERENCIA</div><div class="pago-cuenta-num">${p.cuenta} 📋</div></div>` : ''}
                ${p.notas ? `<div class="pago-notas">💡 ${p.notas}</div>` : ''}
                <div class="pago-actions">
                    ${!p.pagadoEsteMes ? `<button class="pago-btn pago-btn-pagar" onclick="marcarPagado('${p.id}')">✓ Pagado</button>` : ''}
                    <button class="pago-btn pago-btn-historial" onclick="verHistorial('${p.id}')">📊</button>
                    <button class="pago-btn pago-btn-edit" onclick="editarItem('${p.id}')">✏️</button>
                    <button class="pago-btn pago-btn-del" onclick="eliminarItem('${p.id}')">🗑️</button>
                </div>
            </div>`;
        }

        function renderNota(n) {
            const fecha = n.fecha ? new Date(n.fecha).toLocaleDateString('es-MX', {day:'numeric',month:'short',year:'numeric'}) : '';
            return `<div class="nota-card">
                <div class="nota-titulo">${n.titulo}</div>
                ${n.descripcion ? `<div class="nota-desc">${n.descripcion}</div>` : ''}
                <div class="nota-fecha">📅 ${fecha}</div>
                <div class="nota-actions">
                    <button class="pago-btn pago-btn-edit" onclick="editarItem('${n.id}')">✏️</button>
                    <button class="pago-btn pago-btn-del" onclick="eliminarItem('${n.id}')">🗑️</button>
                </div>
            </div>`;
        }

        function renderProyecto(p) {
            const estados = {pendiente: ['Pendiente','estado-pendiente'], progreso: ['En progreso','estado-progreso'], completado: ['Completado','estado-completado']};
            const [txt, cls] = estados[p.estado || 'pendiente'];
            return `<div class="proyecto-card">
                <div class="proyecto-header">
                    <span class="proyecto-titulo">${p.nombre}</span>
                    <span class="proyecto-estado ${cls}">${txt}</span>
                </div>
                ${p.descripcion ? `<div class="proyecto-desc">${p.descripcion}</div>` : ''}
                <div class="proyecto-actions">
                    <button class="pago-btn pago-btn-edit" onclick="editarItem('${p.id}')">✏️</button>
                    <button class="pago-btn pago-btn-del" onclick="eliminarItem('${p.id}')">🗑️</button>
                </div>
            </div>`;
        }

        function renderTarea(t) {
            return `<div class="tarea-card ${t.completada ? 'completada' : ''}">
                <div class="tarea-check ${t.completada ? 'checked' : ''}" onclick="toggleTarea('${t.id}')">${t.completada ? '✓' : ''}</div>
                <div class="tarea-content">
                    <div class="tarea-titulo">${t.titulo}</div>
                    ${t.fechaLimite ? `<div class="tarea-fecha">📅 ${new Date(t.fechaLimite).toLocaleDateString('es-MX')}</div>` : ''}
                </div>
                <div class="tarea-actions">
                    <button class="tarea-btn pago-btn-edit" onclick="editarItem('${t.id}')">✏️</button>
                    <button class="tarea-btn pago-btn-del" onclick="eliminarItem('${t.id}')">🗑️</button>
                </div>
            </div>`;
        }

        // MODAL ITEM
        function abrirModalItem(item = null) {
            editandoItem = item;
            const tab = getTabActiva();
            if (!tab) { toast('⚠️ Selecciona una categoría'); return; }
            const tipo = tab.tipo || 'notas';
            let html = '';

            if (tipo === 'pagos') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nuevo'} Pago</h2>
                    <div class="form-group"><label class="form-label">Nombre</label><input type="text" class="form-input" id="item-nombre" value="${item?.nombre || ''}" placeholder="Ej: Luz, Internet..."></div>
                    <div class="form-group"><label class="form-label">Día del mes</label><input type="number" class="form-input" id="item-dia" min="1" max="31" value="${item?.dia || new Date().getDate()}"></div>
                    <div class="form-group"><label class="form-label">Monto $</label><input type="number" class="form-input" id="item-monto" value="${item?.monto || ''}" placeholder="0.00"></div>
                    <div class="form-group"><label class="form-label">Número cuenta/referencia</label><input type="text" class="form-input" id="item-cuenta" value="${item?.cuenta || ''}" placeholder="Opcional"></div>
                    <div class="form-group"><label class="form-label">Notas</label><textarea class="form-input" id="item-notas" placeholder="Opcional">${item?.notas || ''}</textarea></div>`;
            } else if (tipo === 'notas') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nueva'} Nota</h2>
                    <div class="form-group"><label class="form-label">Título</label><input type="text" class="form-input" id="item-titulo" value="${item?.titulo || ''}" placeholder="Título de la nota"></div>
                    <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-input" id="item-desc" style="min-height:150px" placeholder="Escribe aquí...">${item?.descripcion || ''}</textarea></div>`;
            } else if (tipo === 'proyectos') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nuevo'} Proyecto</h2>

                            <option value="pendiente" ${item?.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="progreso" ${item?.estado === 'progreso' ? 'selected' : ''}>En progreso</option>
                            <option value="completado" ${item?.estado === 'completado' ? 'selected' : ''}>Completado</option>
                        </select>
                    </div>`;
            } else if (tipo === 'tareas') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nueva'} Tarea</h2>
                    <div class="form-group"><label class="form-label">Tarea</label><input type="text" class="form-input" id="item-titulo" value="${item?.titulo || ''}" placeholder="¿Qué necesitas hacer?"></div>
                    <div class="form-group"><label class="form-label">Fecha límite (opcional)</label><input type="date" class="form-input" id="item-fecha" value="${item?.fechaLimite || ''}"></div>`;
            } else {
                html = `<h2>➕ Nueva Nota</h2>
                    <div class="form-group"><label class="form-label">Título</label><input type="text" class="form-input" id="item-titulo" value="" placeholder="Título"></div>
                    <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-input" id="item-desc" style="min-height:150px" placeholder="Escribe aquí..."></textarea></div>`;
            }

            html += `<div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="cerrarModalItem()">Cancelar</button>
                <button class="modal-btn btn-save" onclick="guardarItem()">Guardar</button>
            </div>`;

            document.getElementById('modal-item-content').innerHTML = html;
            document.getElementById('modal-item').classList.add('visible');
        }

        function cerrarModalItem() { document.getElementById('modal-item').classList.remove('visible'); editandoItem = null; }

        function editarItem(id) { abrirModalItem(items.find(i => i.id === id)); }

        async function guardarItem() {
            const tab = getTabActiva();
            if (!tab) return;
            const tipo = tab.tipo || 'notas';
            let data = {tabId: tabActiva, usuarioId: usuario.uid};

            if (tipo === 'pagos') {
                data.nombre = document.getElementById('item-nombre').value.trim();
                data.dia = parseInt(document.getElementById('item-dia').value) || 1;
                data.monto = document.getElementById('item-monto').value;
                data.cuenta = document.getElementById('item-cuenta').value.trim();
                data.notas = document.getElementById('item-notas').value.trim();
                data.icono = '💳';
                if (!data.nombre) { toast('⚠️ Escribe el nombre'); return; }
            } else if (tipo === 'notas') {
                data.titulo = document.getElementById('item-titulo').value.trim();
                data.descripcion = document.getElementById('item-desc').value.trim();
                data.fecha = new Date().toISOString();
                if (!data.titulo) { toast('⚠️ Escribe el título'); return; }
            } else if (tipo === 'proyectos') {
                data.nombre = document.getElementById('item-nombre').value.trim();
                data.descripcion = document.getElementById('item-desc').value.trim();
                data.estado = document.getElementById('item-estado').value;
                if (!data.nombre) { toast('⚠️ Escribe el nombre'); return; }
            } else if (tipo === 'tareas') {
                data.titulo = document.getElementById('item-titulo').value.trim();
                data.fechaLimite = document.getElementById('item-fecha').value;
                data.completada = editandoItem?.completada || false;
                if (!data.titulo) { toast('⚠️ Escribe la tarea'); return; }
            } else {
                data.titulo = document.getElementById('item-titulo').value.trim();
                data.descripcion = document.getElementById('item-desc')?.value.trim() || '';
                data.fecha = new Date().toISOString();
                if (!data.titulo) { toast('⚠️ Escribe el título'); return; }
            }

            if (editandoItem) {
                await db.collection('items').doc(editandoItem.id).update(data);
            } else {
                await db.collection('items').add(data);
            }
            cerrarModalItem(); cargarItems(); toast('✓ Guardado');
        }

        async function eliminarItem(id) {
            if (!confirm('¿Eliminar?')) return;
            await db.collection('items').doc(id).delete();
            cargarItems(); toast('✓ Eliminado');
        }

        async function toggleTarea(id) {
            const t = items.find(i => i.id === id);
            await db.collection('items').doc(id).update({completada: !t.completada});
            cargarItems();
        }

        async function marcarPagado(id) {
            const p = items.find(i => i.id === id);
            const historial = p.historial || [];
            historial.push({fecha: new Date().toISOString(), monto: p.monto});
            await db.collection('items').doc(id).update({pagadoEsteMes: true, historial});
            cargarItems(); toast('✓ Marcado como pagado');
        }

        function verHistorial(id) {
            const p = items.find(i => i.id === id);
            const hist = p.historial || [];
            document.getElementById('historial-list').innerHTML = hist.length ? 
                hist.slice().reverse().map(h => `<div class="historial-item"><span class="historial-fecha">${new Date(h.fecha).toLocaleDateString('es-MX')}</span><span class="historial-monto">$${parseFloat(h.monto || 0).toLocaleString()}</span></div>`).join('') :
                '<p style="color:#64748b;text-align:center">Sin historial</p>';
            document.getElementById('modal-historial').classList.add('visible');
        }

        function cerrarHistorial() { document.getElementById('modal-historial').classList.remove('visible'); }

        // Reset pagos cada mes
        async function resetPagos() {
            const hoy = new Date(), mesActual = `${hoy.getFullYear()}-${hoy.getMonth()}`;
            const ultimoReset = localStorage.getItem('ultimoReset');
            if (ultimoReset !== mesActual) {
                const snap = await db.collection('items').where('usuarioId', '==', usuario.uid).get();
                const batch = db.batch();
                snap.forEach(d => { if (d.data().pagadoEsteMes) batch.update(d.ref, {pagadoEsteMes: false}); });
                await batch.commit();
                localStorage.setItem('ultimoReset', mesActual);
            }
        }

        // UTILS
        function copiar(t) { navigator.clipboard.writeText(t); toast('📋 Copiado'); }
        function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('visible'); setTimeout(() => t.classList.remove('visible'), 2500); }
        function mostrarFecha() { document.getElementById('fecha-hoy').textContent = new Date().toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'}); resetPagos(); }

        document.getElementById('login-password').onkeypress = e => { if (e.key === 'Enter') iniciarSesion(); };
    </script>
</body>
</html>
