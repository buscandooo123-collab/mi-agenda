<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Mi Agenda Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);min-height:100vh;color:#f8fafc}
        #login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0a1e 0%,#1e1b4b 50%,#0f0a1e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;padding:2rem}
        #login-screen.hidden{display:none}
        .login-titulo{font-family:'Satisfy',cursive;font-size:2.5rem;margin-bottom:0.5rem;text-shadow:2px 2px 20px rgba(99,102,241,0.5)}
        .login-subtitulo{color:#a5b4fc;margin-bottom:2rem;font-size:0.95rem}
        .login-form{width:100%;max-width:320px}
        .login-input{width:100%;padding:1rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:12px;color:#f8fafc;font-size:1rem;margin-bottom:1rem;outline:none}
        .login-input:focus{border-color:#6366f1}
        .login-btn{width:100%;padding:1rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:white;font-size:1rem;font-weight:700;cursor:pointer}
        .login-btn:disabled{opacity:0.6}
        .login-error{color:#f87171;font-size:0.9rem;margin-bottom:1rem;text-align:center;min-height:1.5rem}
        .login-registro{margin-top:1.5rem;color:#94a3b8;font-size:0.9rem;text-align:center}
        .login-registro a{color:#a5b4fc;cursor:pointer;text-decoration:underline}
        #patron-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0a1e 0%,#1e1b4b 50%,#0f0a1e 100%);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:2rem}
        #patron-screen.visible{display:flex}
        .patron-titulo{font-family:'Satisfy',cursive;font-size:2.2rem;margin-bottom:0.5rem}
        .patron-subtitulo{color:#a5b4fc;margin-bottom:2rem}
        .patron-mensaje{color:#fbbf24;margin-bottom:1rem;min-height:1.5rem;font-weight:600}
        .patron-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;padding:1.5rem;background:rgba(30,41,59,0.5);border-radius:24px;border:1px solid rgba(99,102,241,0.2);touch-action:none;position:relative}
        .patron-punto{width:70px;height:70px;border-radius:50%;background:rgba(99,102,241,0.2);border:3px solid rgba(99,102,241,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.15s}
        .patron-punto.activo{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:#a5b4fc;box-shadow:0 0 20px rgba(99,102,241,0.6);transform:scale(1.1)}
        .patron-punto-centro{width:20px;height:20px;border-radius:50%;background:rgba(165,180,252,0.5)}
        .patron-punto.activo .patron-punto-centro{background:white}
        .patron-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
        .btn-patron{padding:0.75rem 1.5rem;border-radius:12px;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;background:rgba(71,85,105,0.5);color:#cbd5e1;margin-top:2rem}
        #app{display:none;padding:1.5rem;padding-bottom:100px}
        #app.visible{display:block}
        .header{text-align:center;margin-bottom:2rem}
        .header h1{font-family:'Satisfy',cursive;font-size:2.5rem;text-shadow:2px 2px 20px rgba(99,102,241,0.5)}
        .header p{color:#a5b4fc;font-size:0.95rem}
        .user-info{display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-top:0.5rem;color:#64748b;font-size:0.8rem}
        .btn-logout{background:none;border:none;color:#f87171;cursor:pointer;font-size:0.8rem;text-decoration:underline}
        .btn-agregar{width:100%;padding:1rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:16px;color:white;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(99,102,241,0.4)}
        .lista-vacia{text-align:center;padding:3rem 1rem;color:#94a3b8}
        .lista-vacia .icono{font-size:4rem;margin-bottom:1rem;opacity:0.5}
        .recordatorio{background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:20px;padding:1.25rem;margin-bottom:1rem;border:2px solid rgba(99,102,241,0.2);position:relative;overflow:hidden}
        .recordatorio.urgente{border-color:#ef4444;animation:pulse 2s infinite}
        .recordatorio.proximo{border-color:#f59e0b}
        @keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(239,68,68,0.3)}50%{box-shadow:0 0 40px rgba(239,68,68,0.5)}}
        .recordatorio-acento{position:absolute;top:0;left:0;width:4px;height:100%}
        .recordatorio-contenido{display:flex;align-items:flex-start;gap:1rem}
        .recordatorio-icono{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
        .recordatorio-info{flex:1;min-width:0}
        .recordatorio-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;gap:0.5rem}
        .recordatorio-nombre{font-size:1.1rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .recordatorio-badge{padding:0.35rem 0.75rem;border-radius:20px;font-size:0.75rem;font-weight:700;white-space:nowrap}
        .badge-urgente{background:linear-gradient(135deg,#ef4444,#dc2626)}
        .badge-proximo{background:linear-gradient(135deg,#f59e0b,#d97706)}
        .badge-cercano{background:linear-gradient(135deg,#14b8a6,#0d9488)}
        .badge-normal{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
        .recordatorio-fecha{color:#94a3b8;font-size:0.9rem;margin-bottom:0.75rem}
        .recordatorio-cuenta{background:rgba(15,23,42,0.6);border-radius:10px;padding:0.75rem;margin-bottom:0.75rem;cursor:pointer;border:1px solid rgba(99,102,241,0.2)}
        .recordatorio-cuenta-label{color:#64748b;font-size:0.75rem;margin-bottom:0.25rem;font-weight:600}
        .recordatorio-cuenta-numero{color:#e2e8f0;font-family:monospace;font-size:0.95rem}
        .recordatorio-notas{color:#94a3b8;font-size:0.85rem;font-style:italic;background:rgba(99,102,241,0.1);padding:0.5rem 0.75rem;border-radius:8px;margin-bottom:0.75rem}
        .recordatorio-acciones{display:flex;gap:0.5rem;margin-top:0.5rem}
        .btn-accion{padding:0.5rem 1rem;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;border:1px solid}
        .btn-editar{background:rgba(99,102,241,0.2);border-color:rgba(99,102,241,0.3);color:#a5b4fc}
        .btn-eliminar{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#fca5a5}
        .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem}
        .modal-overlay.visible{display:flex}
        .modal{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:24px;padding:1.5rem;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;border:1px solid rgba(99,102,241,0.2)}
        .modal h2{font-size:1.4rem;margin-bottom:1.5rem}
        .form-grupo{margin-bottom:1rem}
        .form-label{color:#94a3b8;font-size:0.85rem;display:block;margin-bottom:0.5rem;font-weight:600}
        .form-input{width:100%;padding:0.875rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:12px;color:#f8fafc;font-size:1rem;outline:none;font-family:inherit}
        .form-input:focus{border-color:#6366f1}
        .form-input.mono{font-family:monospace}
        textarea.form-input{resize:none}
        .selector-grid{display:flex;flex-wrap:wrap;gap:0.5rem}
        .selector-item{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:rgba(30,41,59,0.5);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .selector-item.activo{border-color:#6366f1;background:rgba(99,102,241,0.2)}
        .selector-color{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
        .selector-color.activo{border-color:white}
        .modal-acciones{display:flex;gap:0.75rem;margin-top:1.5rem}
        .btn-modal{flex:1;padding:0.875rem;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}
        .btn-cancelar{background:rgba(71,85,105,0.5);color:#cbd5e1}
        .btn-guardar{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
        .footer{text-align:center;margin-top:2rem;padding:1rem;color:#64748b;font-size:0.8rem}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#f8fafc;padding:0.75rem 1.5rem;border-radius:12px;font-weight:600;transition:transform 0.3s;z-index:2000}
        .toast.visible{transform:translateX(-50%) translateY(0)}
        .btn-bloquear{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:white;font-size:1.5rem;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center}
    </style>
</head>
<body>
    <div id="login-screen">
        <h1 class="login-titulo">🔐 Mi Agenda</h1>
        <p class="login-subtitulo">Inicia sesión para acceder</p>
        <div class="login-form">
            <input type="email" class="login-input" id="login-email" placeholder="Correo electrónico">
            <input type="password" class="login-input" id="login-password" placeholder="Contraseña">
            <p class="login-error" id="login-error"></p>
            <button class="login-btn" id="btn-login" onclick="iniciarSesion()">Iniciar sesión</button>
            <p class="login-registro">¿Primera vez? <a onclick="registrarse()">Crear cuenta</a></p>
        </div>
    </div>
    <div id="patron-screen">
        <h1 class="patron-titulo">🔐 Mi Agenda</h1>
        <p class="patron-subtitulo" id="patron-modo">Dibuja tu patrón</p>
        <p class="patron-mensaje" id="patron-mensaje"></p>
        <div class="patron-grid" id="patron-grid">
            <canvas class="patron-canvas" id="patron-canvas"></canvas>
            <div class="patron-punto" data-index="0"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="1"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="2"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="3"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="4"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="5"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="6"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="7"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="8"><div class="patron-punto-centro"></div></div>
        </div>
        <button class="btn-patron" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
    <div id="app">
        <div class="header">
            <h1>Mi Agenda Personal</h1>
            <p id="fecha-hoy"></p>
            <div class="user-info"><span id="user-email"></span><button class="btn-logout" onclick="cerrarSesion()">Salir</button></div>
        </div>
        <button class="btn-agregar" onclick="abrirModal()"><span style="font-size:1.3rem">+</span> Agregar recordatorio</button>
        <div id="lista-recordatorios"></div>
        <div class="footer">✨ Datos protegidos en la nube</div>
        <button class="btn-bloquear" onclick="bloquearApp()">🔒</button>
    </div>
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-titulo">✨ Nuevo recordatorio</h2>
            <div class="form-grupo"><label class="form-label">Nombre</label><input type="text" class="form-input" id="input-nombre" placeholder="Ej: Tarjeta BBVA"></div>
            <div class="form-grupo"><label class="form-label">Día del mes</label><input type="number" class="form-input" id="input-dia" min="1" max="31" value="1"></div>
            <div class="form-grupo"><label class="form-label">Número de cuenta (opcional)</label><input type="text" class="form-input mono" id="input-cuenta" placeholder="Ej: 4152 3138 xxxx"></div>
            <div class="form-grupo"><label class="form-label">Notas (opcional)</label><textarea class="form-input" id="input-notas" rows="2" placeholder="Ej: Pagar en OXXO"></textarea></div>
            <div class="form-grupo"><label class="form-label">Icono</label><div class="selector-grid" id="selector-iconos"></div></div>
            <div class="form-grupo"><label class="form-label">Color</label><div class="selector-grid" id="selector-colores"></div></div>
            <div class="modal-acciones"><button class="btn-modal btn-cancelar" onclick="cerrarModal()">Cancelar</button><button class="btn-modal btn-guardar" onclick="guardarRecordatorio()">Guardar</button></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiFwURHHCwGg6_3scyUxO43ib6kH-y8AM",
            authDomain: "agenda-pendientes-y-proyectos.firebaseapp.com",
            projectId: "agenda-pendientes-y-proyectos",
            storageBucket: "agenda-pendientes-y-proyectos.firebasestorage.app",
            messagingSenderId: "534286151036",
            appId: "1:534286151036:web:2114bf9b316ae7262688f9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const iconos = ['💳','💡','📱','🌐','🏠','🚗','📺','🎮','💊','📦','🛒','⚡'];
        const colores = ['#6366f1','#ec4899','#14b8a6','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#84cc16'];
        let recordatorios = [], editandoId = null, iconoSeleccionado = '💳', colorSeleccionado = '#6366f1', usuarioActual = null;
        let patronGuardado = localStorage.getItem('patron_agenda'), patronActual = [], dibujando = false, modoConfig = !patronGuardado, patronTemp = null, patronCtx;
        const puntos = document.querySelectorAll('.patron-punto'), patronGrid = document.getElementById('patron-grid'), patronCanvas = document.getElementById('patron-canvas');

        auth.onAuthStateChanged(user => {
            if (user) {
                usuarioActual = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('user-email').textContent = user.email;
                initPatron();
            } else {
                usuarioActual = null;
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('patron-screen').classList.remove('visible');
                document.getElementById('app').classList.remove('visible');
            }
        });

        async function iniciarSesion() {
            const e = document.getElementById('login-email').value.trim();
            const p = document.getElementById('login-password').value;
            if (!e || !p) { document.getElementById('login-error').textContent = 'Completa los campos'; return; }
            document.getElementById('btn-login').disabled = true;
            document.getElementById('login-error').textContent = '';
            try {
                await auth.signInWithEmailAndPassword(e, p);
            } catch (err) {
                console.error('Error login:', err);
                let msg = 'Error al iniciar sesión';
                if (err.code === 'auth/user-not-found') msg = 'Usuario no existe';
                else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Contraseña incorrecta';
                else if (err.code === 'auth/invalid-email') msg = 'Correo inválido';
                else if (err.code === 'auth/too-many-requests') msg = 'Demasiados intentos, espera un momento';
                document.getElementById('login-error').textContent = msg;
            }
            document.getElementById('btn-login').disabled = false;
        }

        async function registrarse() {
            const e = document.getElementById('login-email').value.trim();
            const p = document.getElementById('login-password').value;
            if (!e || !p) { document.getElementById('login-error').textContent = 'Completa los campos'; return; }
            if (p.length < 6) { document.getElementById('login-error').textContent = 'Mínimo 6 caracteres'; return; }
            document.getElementById('btn-login').disabled = true;
            document.getElementById('login-error').textContent = 'Creando cuenta...';
            try {
                await auth.createUserWithEmailAndPassword(e, p);
            } catch (err) {
                console.error('Error registro:', err);
                let msg = 'Error al crear cuenta';
                if (err.code === 'auth/email-already-in-use') msg = 'Correo ya registrado, inicia sesión';
                else if (err.code === 'auth/weak-password') msg = 'Contraseña muy débil';
                document.getElementById('login-error').textContent = msg;
            }
            document.getElementById('btn-login').disabled = false;
        }

        function cerrarSesion() { auth.signOut(); }

        function initPatron() {
            document.getElementById('patron-screen').classList.add('visible');
            setTimeout(() => {
                const r = patronGrid.getBoundingClientRect();
                patronCanvas.width = r.width;
                patronCanvas.height = r.height;
                patronCtx = patronCanvas.getContext('2d');
            }, 100);
            patronGuardado = localStorage.getItem('patron_agenda');
            modoConfig = !patronGuardado;
            patronTemp = null;
            document.getElementById('patron-modo').textContent = modoConfig ? 'Crea tu patrón (4+ puntos)' : 'Dibuja tu patrón';
            document.getElementById('patron-mensaje').textContent = modoConfig ? 'Conecta al menos 4 puntos' : '';
            patronGrid.onmousedown = patronGrid.ontouchstart = startDraw;
            patronGrid.onmousemove = patronGrid.ontouchmove = moveDraw;
            patronGrid.onmouseup = patronGrid.ontouchend = patronGrid.onmouseleave = endDraw;
        }

        function getCoords(e) { const r = patronGrid.getBoundingClientRect(); return e.touches ? {x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top} : {x: e.clientX - r.left, y: e.clientY - r.top}; }
        function getPunto(x, y) { for (let p of puntos) { const r = p.getBoundingClientRect(), gr = patronGrid.getBoundingClientRect(), cx = r.left - gr.left + r.width/2, cy = r.top - gr.top + r.height/2; if (Math.sqrt((x-cx)**2 + (y-cy)**2) < 40) return parseInt(p.dataset.index); } return -1; }
        function getCentro(i) { const p = puntos[i], r = p.getBoundingClientRect(), gr = patronGrid.getBoundingClientRect(); return {x: r.left - gr.left + r.width/2, y: r.top - gr.top + r.height/2}; }

        function startDraw(e) { e.preventDefault(); dibujando = true; patronActual = []; if (patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); const c = getCoords(e), pt = getPunto(c.x, c.y); if (pt >= 0) { patronActual.push(pt); puntos[pt].classList.add('activo'); } }
        function moveDraw(e) { if (!dibujando) return; e.preventDefault(); const c = getCoords(e), pt = getPunto(c.x, c.y); if (pt >= 0 && !patronActual.includes(pt)) { patronActual.push(pt); puntos[pt].classList.add('activo'); } drawLines(c); }
        function endDraw() { if (!dibujando) return; dibujando = false; drawLines(); validatePatron(); }

        function drawLines(cur = null) { if (!patronCtx) return; patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); if (!patronActual.length) return; patronCtx.strokeStyle = '#6366f1'; patronCtx.lineWidth = 4; patronCtx.lineCap = 'round'; patronCtx.beginPath(); const s = getCentro(patronActual[0]); patronCtx.moveTo(s.x, s.y); for (let i = 1; i < patronActual.length; i++) { const c = getCentro(patronActual[i]); patronCtx.lineTo(c.x, c.y); } if (cur && dibujando) patronCtx.lineTo(cur.x, cur.y); patronCtx.stroke(); }

        function validatePatron() {
            const msg = document.getElementById('patron-mensaje');
            if (modoConfig) {
                if (patronActual.length >= 4) {
                    if (!patronTemp) { patronTemp = patronActual.join('-'); msg.textContent = '✓ Dibújalo de nuevo'; msg.style.color = '#4ade80'; setTimeout(() => { patronActual = []; if (patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); }, 1000); }
                    else if (patronActual.join('-') === patronTemp) { localStorage.setItem('patron_agenda', patronTemp); msg.textContent = '✓ ¡Guardado!'; msg.style.color = '#4ade80'; setTimeout(unlock, 500); }
                    else { msg.textContent = '✗ No coinciden'; msg.style.color = '#f87171'; patronTemp = null; setTimeout(() => { patronActual = []; if (patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); msg.textContent = 'Conecta al menos 4 puntos'; msg.style.color = '#fbbf24'; }, 1500); }
                } else { msg.textContent = 'Mínimo 4 puntos'; msg.style.color = '#fbbf24'; }
            } else {
                if (patronActual.join('-') === patronGuardado) { msg.textContent = '✓ Desbloqueado'; msg.style.color = '#4ade80'; setTimeout(unlock, 300); }
                else { msg.textContent = '✗ Incorrecto'; msg.style.color = '#f87171'; setTimeout(() => { patronActual = []; if (patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); msg.textContent = ''; }, 1000); }
            }
        }

        function unlock() { document.getElementById('patron-screen').classList.remove('visible'); document.getElementById('app').classList.add('visible'); cargarRecordatorios(); }
        function bloquearApp() { patronActual = []; if (patronCtx) patronCtx.clearRect(0,0,patronCanvas.width,patronCanvas.height); puntos.forEach(p => p.classList.remove('activo')); document.getElementById('patron-mensaje').textContent = ''; document.getElementById('patron-screen').classList.add('visible'); document.getElementById('app').classList.remove('visible'); }

        function mostrarFecha() { const h = new Date(); document.getElementById('fecha-hoy').textContent = '📅 ' + h.toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'}); }
        
        function initSelectores() {
            const si = document.getElementById('selector-iconos'), sc = document.getElementById('selector-colores');
            si.innerHTML = ''; sc.innerHTML = '';
            iconos.forEach(i => { const b = document.createElement('button'); b.type = 'button'; b.className = 'selector-item' + (i === iconoSeleccionado ? ' activo' : ''); b.textContent = i; b.onclick = () => { iconoSeleccionado = i; document.querySelectorAll('#selector-iconos .selector-item').forEach(x => x.classList.toggle('activo', x.textContent === i)); }; si.appendChild(b); });
            colores.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'selector-color' + (c === colorSeleccionado ? ' activo' : ''); b.style.background = c; b.onclick = () => { colorSeleccionado = c; document.querySelectorAll('#selector-colores .selector-color').forEach(x => x.classList.toggle('activo', x.style.background === c)); }; sc.appendChild(b); });
        }

        function abrirModal(r = null) {
            const m = document.getElementById('modal'), t = document.getElementById('modal-titulo');
            if (r) { editandoId = r.id; t.textContent = '✏️ Editar'; document.getElementById('input-nombre').value = r.nombre; document.getElementById('input-dia').value = r.diaMes; document.getElementById('input-cuenta').value = r.numeroCuenta || ''; document.getElementById('input-notas').value = r.notas || ''; iconoSeleccionado = r.icono; colorSeleccionado = r.color; }
            else { editandoId = null; t.textContent = '✨ Nuevo'; document.getElementById('input-nombre').value = ''; document.getElementById('input-dia').value = 1; document.getElementById('input-cuenta').value = ''; document.getElementById('input-notas').value = ''; iconoSeleccionado = '💳'; colorSeleccionado = '#6366f1'; }
            initSelectores(); m.classList.add('visible');
        }
        function cerrarModal() { document.getElementById('modal').classList.remove('visible'); }

        async function guardarRecordatorio() {
            const n = document.getElementById('input-nombre').value.trim();
            if (!n) { toast('⚠️ Escribe nombre'); return; }
            if (!usuarioActual) return;
            const d = { nombre: n, diaMes: parseInt(document.getElementById('input-dia').value) || 1, numeroCuenta: document.getElementById('input-cuenta').value.trim(), notas: document.getElementById('input-notas').value.trim(), icono: iconoSeleccionado, color: colorSeleccionado, usuarioId: usuarioActual.uid, actualizado: new Date().toISOString() };
            try {
                if (editandoId) await db.collection('recordatorios').doc(editandoId).update(d);
                else { d.creado = new Date().toISOString(); await db.collection('recordatorios').add(d); }
                cerrarModal(); cargarRecordatorios(); toast('✓ Guardado');
            } catch (e) { console.error(e); toast('❌ Error'); }
        }

        async function eliminarRecordatorio(id) { if (!confirm('¿Eliminar?')) return; try { await db.collection('recordatorios').doc(id).delete(); cargarRecordatorios(); toast('✓ Eliminado'); } catch (e) { toast('❌ Error'); } }

        async function cargarRecordatorios() {
            if (!usuarioActual) return;
            try { const s = await db.collection('recordatorios').where('usuarioId', '==', usuarioActual.uid).get(); recordatorios = []; s.forEach(d => recordatorios.push({id: d.id, ...d.data()})); render(); }
            catch (e) { console.error(e); toast('❌ Error cargando'); }
        }

        function diasRestantes(dia) { const h = new Date(), d = h.getDate(), m = h.getMonth(), a = h.getFullYear(); let f = new Date(a, m, dia); if (dia < d) f = new Date(a, m+1, dia); return Math.ceil((f - h) / (1000*60*60*24)); }
        function estado(dr) { if (dr === 0) return {t:'¡HOY!', c:'urgente', e:'🔔'}; if (dr === 1) return {t:'MAÑANA', c:'proximo', e:'⚠️'}; if (dr <= 3) return {t:dr+' días', c:'cercano', e:'📅'}; if (dr <= 7) return {t:dr+' días', c:'semana', e:'📆'}; return {t:dr+' días', c:'normal', e:'✓'}; }

        function render() {
            const l = document.getElementById('lista-recordatorios');
            if (!recordatorios.length) { l.innerHTML = '<div class="lista-vacia"><div class="icono">📋</div><p>Tu agenda está vacía</p></div>'; return; }
            const ord = [...recordatorios].sort((a,b) => diasRestantes(a.diaMes) - diasRestantes(b.diaMes));
            l.innerHTML = ord.map(r => { const dr = diasRestantes(r.diaMes), es = estado(dr); return `
                <div class="recordatorio ${es.c==='urgente'?'urgente':''} ${es.c==='proximo'?'proximo':''}">
                    <div class="recordatorio-acento" style="background:${r.color}"></div>
                    <div class="recordatorio-contenido">
                        <div class="recordatorio-icono" style="background:linear-gradient(135deg,${r.color}30,${r.color}10);border:1px solid ${r.color}40">${r.icono}</div>
                        <div class="recordatorio-info">
                            <div class="recordatorio-header"><span class="recordatorio-nombre">${r.nombre}</span><span class="recordatorio-badge badge-${es.c}">${es.e} ${es.t}</span></div>
                            <p class="recordatorio-fecha">📅 Día <strong>${r.diaMes}</strong> de cada mes</p>
                            ${r.numeroCuenta ? `<div class="recordatorio-cuenta" onclick="copiar('${r.numeroCuenta}')"><div class="recordatorio-cuenta-label">CUENTA/RECIBO</div><div class="recordatorio-cuenta-numero">${r.numeroCuenta} 📋</div></div>` : ''}
                            ${r.notas ? `<p class="recordatorio-notas">💡 ${r.notas}</p>` : ''}
                            <div class="recordatorio-acciones"><button class="btn-accion btn-editar" onclick='abrirModal(${JSON.stringify(r).replace(/'/g, "\\'")})'>✏️ Editar</button><button class="btn-accion btn-eliminar" onclick="eliminarRecordatorio('${r.id}')">🗑️</button></div>
                        </div>
                    </div>
                </div>`; }).join('');
        }

        function copiar(t) { navigator.clipboard.writeText(t); toast('📋 Copiado'); }
        function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('visible'); setTimeout(() => t.classList.remove('visible'), 2500); }

        document.addEventListener('DOMContentLoaded', () => { mostrarFecha(); initSelectores(); });
        document.getElementById('login-password').onkeypress = e => { if (e.key === 'Enter') iniciarSesion(); };
    </script>
</body>
</html>
