<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Mi Agenda Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);min-height:100vh;color:#f8fafc;overflow-x:hidden}
        
        #login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0a1e 0%,#1e1b4b 50%,#0f0a1e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;padding:2rem}
        #login-screen.hidden{display:none}
        .login-titulo{font-family:'Satisfy',cursive;font-size:2.5rem;margin-bottom:0.5rem;text-shadow:2px 2px 20px rgba(99,102,241,0.5)}
        .login-subtitulo{color:#a5b4fc;margin-bottom:2rem;font-size:0.95rem}
        .login-form{width:100%;max-width:320px}
        .login-input{width:100%;padding:1rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:12px;color:#f8fafc;font-size:1rem;margin-bottom:1rem;outline:none}
        .login-input:focus{border-color:#6366f1}
        .login-btn{width:100%;padding:1rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:white;font-size:1rem;font-weight:700;cursor:pointer}
        .login-error{color:#f87171;font-size:0.9rem;margin-bottom:1rem;text-align:center;min-height:1.5rem}
        .login-registro{margin-top:1.5rem;color:#94a3b8;font-size:0.9rem;text-align:center}
        .login-registro a{color:#a5b4fc;cursor:pointer;text-decoration:underline}
        
        #patron-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0a1e 0%,#1e1b4b 50%,#0f0a1e 100%);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:2rem}
        #patron-screen.visible{display:flex}
        .patron-titulo{font-family:'Satisfy',cursive;font-size:2.2rem;margin-bottom:0.5rem}
        .patron-subtitulo{color:#a5b4fc;margin-bottom:2rem}
        .patron-mensaje{color:#fbbf24;margin-bottom:1rem;min-height:1.5rem;font-weight:600}
        .patron-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;padding:1.5rem;background:rgba(30,41,59,0.5);border-radius:24px;border:1px solid rgba(99,102,241,0.2);touch-action:none;position:relative}
        .patron-punto{width:70px;height:70px;border-radius:50%;background:rgba(99,102,241,0.2);border:3px solid rgba(99,102,241,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.15s}
        .patron-punto.activo{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:#a5b4fc;box-shadow:0 0 20px rgba(99,102,241,0.6);transform:scale(1.1)}
        .patron-punto-centro{width:20px;height:20px;border-radius:50%;background:rgba(165,180,252,0.5)}
        .patron-punto.activo .patron-punto-centro{background:white}
        .patron-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
        .btn-patron{padding:0.75rem 1.5rem;border-radius:12px;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;background:rgba(71,85,105,0.5);color:#cbd5e1;margin-top:2rem}
        
        #app{display:none;min-height:100vh}
        #app.visible{display:block}
        
        .topbar{display:flex;align-items:center;padding:1rem;background:rgba(15,23,42,0.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
        .menu-btn{width:44px;height:44px;background:none;border:none;color:#f8fafc;font-size:1.5rem;cursor:pointer;border-radius:12px}
        .back-btn{width:44px;height:44px;background:none;border:none;color:#f8fafc;font-size:1.5rem;cursor:pointer;border-radius:12px}
        .topbar-title{flex:1;text-align:center;font-family:'Satisfy',cursive;font-size:1.8rem}
        .lock-btn{width:44px;height:44px;background:none;border:none;color:#f8fafc;font-size:1.3rem;cursor:pointer;border-radius:12px}
        
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;visibility:hidden;transition:all 0.3s}
        .sidebar-overlay.visible{opacity:1;visibility:visible}
        .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);z-index:201;transition:left 0.3s;display:flex;flex-direction:column}
        .sidebar.visible{left:0}
        .sidebar-header{padding:1.5rem;border-bottom:1px solid rgba(99,102,241,0.2)}
        .sidebar-header h2{font-family:'Satisfy',cursive;font-size:1.8rem;margin-bottom:0.25rem}
        .sidebar-header p{color:#64748b;font-size:0.8rem}
        .sidebar-menu{flex:1;overflow-y:auto;padding:1rem}
        .sidebar-item{display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1rem;border-radius:12px;cursor:pointer;margin-bottom:0.5rem;transition:all 0.2s;border:2px solid transparent}
        .sidebar-item:hover{background:rgba(99,102,241,0.1)}
        .sidebar-item.active{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
        .sidebar-item .icon{font-size:1.3rem}
        .sidebar-item .name{flex:1;font-weight:600}
        .sidebar-item .count{background:rgba(239,68,68,0.8);padding:0.15rem 0.5rem;border-radius:10px;font-size:0.7rem;font-weight:700}
        .sidebar-divider{height:1px;background:rgba(99,102,241,0.2);margin:1rem 0}
        .sidebar-item.add{border:2px dashed rgba(34,197,94,0.4);color:#4ade80}
        .sidebar-footer{padding:1rem;border-top:1px solid rgba(99,102,241,0.2)}
        .sidebar-footer p{color:#64748b;font-size:0.75rem;text-align:center}
        
        .content{padding:1rem;padding-bottom:100px}
        
        /* INICIO */
        .inicio-header{text-align:center;margin-bottom:2rem}
        .inicio-header h1{font-family:'Satisfy',cursive;font-size:2.2rem;margin-bottom:0.5rem}
        .inicio-header p{color:#a5b4fc;font-size:0.9rem}
        
        .pendientes-grid{display:flex;flex-direction:column;gap:1rem}
        
        .pendiente-card{background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:20px;padding:1.5rem;cursor:pointer;transition:all 0.3s;border:2px solid rgba(99,102,241,0.3)}
        .pendiente-card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,0.6)}
        .pendiente-card:active{transform:scale(0.98)}
        .pendiente-card-header{display:flex;align-items:center;gap:1rem;margin-bottom:0.5rem}
        .pendiente-card-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
        .pendiente-card-icon.pagos{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
        .pendiente-card-icon.notas{background:linear-gradient(135deg,#ec4899,#f43f5e)}
        .pendiente-card-icon.proyectos{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
        .pendiente-card-icon.tareas{background:linear-gradient(135deg,#22c55e,#16a34a)}
        .pendiente-card-info{flex:1}
        .pendiente-card-name{font-size:1.2rem;font-weight:700}
        .pendiente-card-count{color:#fbbf24;font-size:0.9rem;font-weight:600}
        .pendiente-card-arrow{color:#64748b;font-size:1.5rem}
        
        .todo-bien{text-align:center;padding:3rem 1rem;color:#64748b}
        .todo-bien .icon{font-size:4rem;margin-bottom:1rem}
        .todo-bien p{font-size:1.1rem}
        
        .ver-todas-btn{display:block;text-align:center;padding:1rem;color:#a5b4fc;font-weight:600;cursor:pointer;margin-top:1rem}
        
        /* DETALLE */
        .detalle-header{margin-bottom:1rem}
        .detalle-header h1{font-size:1.5rem;display:flex;align-items:center;gap:0.5rem}
        
        .stats-bar{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem}
        .stat-card{background:rgba(30,41,59,0.8);border-radius:16px;padding:1rem;border:1px solid rgba(99,102,241,0.2)}
        .stat-card.total{background:linear-gradient(135deg,rgba(99,102,241,0.3),rgba(139,92,246,0.3))}
        .stat-card.pendiente{background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(249,115,22,0.2))}
        .stat-label{color:#94a3b8;font-size:0.75rem;margin-bottom:0.25rem}
        .stat-value{font-size:1.4rem;font-weight:800}
        
        .btn-add{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:50%;color:white;font-size:1.8rem;cursor:pointer;box-shadow:0 4px 20px rgba(99,102,241,0.5);z-index:50;display:none}
        .btn-add.visible{display:flex;align-items:center;justify-content:center}
        
        .btn-share{position:fixed;bottom:20px;left:20px;height:50px;padding:0 1.2rem;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:25px;color:white;font-size:0.9rem;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,0.5);z-index:50;display:none;align-items:center;gap:0.5rem}
        .btn-share.visible{display:flex}
        
        .select-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(99,102,241,0.2);padding:0.75rem 1rem;border-radius:12px;margin-bottom:1rem}
        .select-bar label{display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-weight:600}
        .select-count{color:#a5b4fc;font-size:0.85rem}
        
        .item-checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #6366f1;background:rgba(30,41,59,0.8);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:0.75rem}
        .item-checkbox.checked{background:#6366f1;color:white}
        
        .card-selectable{display:flex;align-items:flex-start}
        .card-selectable .card-content{flex:1}
        
        .item-list{display:flex;flex-direction:column;gap:0.75rem}
        .item-empty{text-align:center;padding:3rem 1rem;color:#64748b}
        .item-empty .icon{font-size:3rem;margin-bottom:0.5rem;opacity:0.5}
        
        .card{background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:16px;padding:1rem;border-left:4px solid #6366f1;margin-bottom:0.75rem}
        .card.urgente{border-left-color:#ef4444;background:linear-gradient(145deg,rgba(127,29,29,0.3),rgba(15,23,42,0.9))}
        .card.proximo{border-left-color:#f59e0b}
        .card.pagado{opacity:0.6;border-left-color:#22c55e}
        .card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:0.5rem}
        .card-titulo{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:0.5rem}
        .card-monto{font-size:1.1rem;font-weight:800;color:#a5b4fc}
        .card-badge{display:inline-block;padding:0.25rem 0.6rem;border-radius:10px;font-size:0.7rem;font-weight:700}
        .badge-hoy{background:#ef4444}
        .badge-pronto{background:#f59e0b}
        .badge-bien{background:#6366f1}
        .badge-pagado{background:#22c55e}
        .badge-pendiente{background:#f59e0b}
        .badge-progreso{background:#3b82f6}
        .badge-completado{background:#22c55e}
        .card-info{color:#94a3b8;font-size:0.8rem;margin-bottom:0.5rem}
        .card-cuenta{background:rgba(15,23,42,0.5);padding:0.5rem;border-radius:8px;margin-bottom:0.5rem;cursor:pointer}
        .card-cuenta-label{color:#64748b;font-size:0.65rem}
        .card-cuenta-num{font-family:monospace;font-size:0.85rem}
        .card-notas{color:#94a3b8;font-size:0.8rem;font-style:italic;background:rgba(99,102,241,0.1);padding:0.4rem 0.6rem;border-radius:6px;margin-bottom:0.5rem}
        .card-desc{color:#94a3b8;font-size:0.85rem;margin-bottom:0.5rem;white-space:pre-wrap}
        .card-fecha{color:#64748b;font-size:0.75rem;margin-bottom:0.5rem}
        .card-actions{display:flex;gap:0.5rem;flex-wrap:wrap}
        .card-btn{padding:0.4rem 0.8rem;border-radius:8px;font-size:0.75rem;font-weight:600;cursor:pointer;border:none}
        .btn-pagar{background:#22c55e;color:white}
        .btn-historial{background:rgba(99,102,241,0.2);color:#a5b4fc}
        .btn-edit{background:rgba(251,191,36,0.2);color:#fbbf24}
        .btn-del{background:rgba(239,68,68,0.15);color:#fca5a5}
        
        .tarea-card{display:flex;align-items:center;gap:1rem;background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));border-radius:16px;padding:1rem}
        .tarea-card.completada{opacity:0.6}
        .tarea-check{width:28px;height:28px;border-radius:50%;border:3px solid #6366f1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.9rem}
        .tarea-check.checked{background:#22c55e;border-color:#22c55e;color:white}
        .tarea-content{flex:1}
        .tarea-titulo{font-size:0.95rem;font-weight:600}
        .tarea-card.completada .tarea-titulo{text-decoration:line-through;color:#64748b}
        .tarea-fecha{color:#94a3b8;font-size:0.75rem}
        
        .modal{position:fixed;inset:0;background:rgba(15,23,42,0.95);display:none;align-items:center;justify-content:center;z-index:500;padding:1rem}
        .modal.visible{display:flex}
        .modal-content{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:20px;padding:1.25rem;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;border:1px solid rgba(99,102,241,0.2)}
        .modal h2{font-size:1.2rem;margin-bottom:1rem}
        .form-group{margin-bottom:1rem}
        .form-label{color:#94a3b8;font-size:0.8rem;display:block;margin-bottom:0.3rem;font-weight:600}
        .form-input{width:100%;padding:0.75rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:10px;color:#f8fafc;font-size:1rem;outline:none;font-family:inherit}
        .form-input:focus{border-color:#6366f1}
        .form-select{width:100%;padding:0.75rem;background:rgba(30,41,59,0.8);border:2px solid rgba(99,102,241,0.3);border-radius:10px;color:#f8fafc;font-size:1rem}
        textarea.form-input{resize:none;min-height:100px}
        .icon-grid{display:flex;flex-wrap:wrap;gap:0.4rem}
        .icon-btn{width:40px;height:40px;border-radius:10px;border:2px solid transparent;background:rgba(30,41,59,0.5);font-size:1.2rem;cursor:pointer}
        .icon-btn.active{border-color:#6366f1;background:rgba(99,102,241,0.2)}
        .tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
        .tipo-btn{padding:1rem;border-radius:12px;border:2px solid rgba(99,102,241,0.3);background:rgba(30,41,59,0.5);cursor:pointer;text-align:center}
        .tipo-btn.active{border-color:#6366f1;background:rgba(99,102,241,0.2)}
        .tipo-btn .icon{font-size:1.5rem}
        .tipo-btn .name{font-size:0.8rem;font-weight:600}
        .modal-actions{display:flex;gap:0.5rem;margin-top:1rem}
        .modal-btn{flex:1;padding:0.75rem;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
        .btn-cancel{background:rgba(71,85,105,0.5);color:#cbd5e1}
        .btn-save{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
        .btn-delete{background:rgba(239,68,68,0.2);color:#fca5a5}
        
        .historial-item{display:flex;justify-content:space-between;padding:0.75rem;background:rgba(30,41,59,0.5);border-radius:8px;margin-bottom:0.5rem}
        .historial-fecha{color:#94a3b8}
        .historial-monto{font-weight:700;color:#22c55e}
        
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#f8fafc;padding:0.75rem 1.5rem;border-radius:12px;font-weight:600;transition:transform 0.3s;z-index:600}
        .toast.visible{transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>
    <div id="login-screen">
        <h1 class="login-titulo">🔐 Mi Agenda</h1>
        <p class="login-subtitulo">Inicia sesión para acceder</p>
        <div class="login-form">
            <input type="email" class="login-input" id="login-email" placeholder="Correo electrónico">
            <input type="password" class="login-input" id="login-password" placeholder="Contraseña">
            <p class="login-error" id="login-error"></p>
            <button class="login-btn" onclick="iniciarSesion()">Iniciar sesión</button>
            <p class="login-registro">¿Primera vez? <a onclick="registrarse()">Crear cuenta</a></p>
        </div>
    </div>

    <div id="patron-screen">
        <h1 class="patron-titulo">🔐 Mi Agenda</h1>
        <p class="patron-subtitulo" id="patron-modo">Dibuja tu patrón</p>
        <p class="patron-mensaje" id="patron-mensaje"></p>
        <div class="patron-grid" id="patron-grid">
            <canvas class="patron-canvas" id="patron-canvas"></canvas>
            <div class="patron-punto" data-index="0"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="1"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="2"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="3"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="4"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="5"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="6"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="7"><div class="patron-punto-centro"></div></div>
            <div class="patron-punto" data-index="8"><div class="patron-punto-centro"></div></div>
        </div>
        <button class="btn-patron" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div id="app">
        <div class="topbar">
            <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()">☰</button>
            <button class="back-btn" id="back-btn" onclick="volverInicio()" style="display:none">←</button>
            <span class="topbar-title" id="topbar-title">Mi Agenda</span>
            <button class="lock-btn" onclick="bloquearApp()">🔒</button>
        </div>
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Mi Agenda</h2>
                <p id="sidebar-email"></p>
            </div>
            <div class="sidebar-menu" id="sidebar-menu"></div>
            <div class="sidebar-footer">
                <p>📅 <span id="fecha-hoy"></span></p>
            </div>
        </div>
        <div class="content" id="content"></div>
        <button class="btn-add" id="btn-add" onclick="abrirModalItem()">+</button>
        <button class="btn-share" id="btn-share" onclick="compartirSeleccionados()">📤 Compartir</button>
    </div>

    <div class="modal" id="modal-item">
        <div class="modal-content" id="modal-item-content"></div>
    </div>

    <div class="modal" id="modal-tab">
        <div class="modal-content">
            <h2 id="modal-tab-titulo">📁 Nueva Categoría</h2>
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-input" id="tab-nombre" placeholder="Ej: Trabajo">
            </div>
            <div class="form-group">
                <label class="form-label">Icono</label>
                <div class="icon-grid" id="tab-icon-grid"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Tipo de contenido</label>
                <div class="tipo-grid" id="tipo-grid"></div>
            </div>
            <div class="modal-actions" id="modal-tab-actions"></div>
        </div>
    </div>

    <div class="modal" id="modal-historial">
        <div class="modal-content">
            <h2>📊 Historial de Pagos</h2>
            <div id="historial-list"></div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="cerrarHistorial()">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiFwURHHCwGg6_3scyUxO43ib6kH-y8AM",
            authDomain: "agenda-pendientes-y-proyectos.firebaseapp.com",
            projectId: "agenda-pendientes-y-proyectos",
            storageBucket: "agenda-pendientes-y-proyectos.firebasestorage.app",

        async function registrarse() {
            const e = document.getElementById('login-email').value.trim();
            const p = document.getElementById('login-password').value;
            if (!e || !p) { document.getElementById('login-error').textContent = 'Completa los campos'; return; }

        }

        function cerrarSesion() { auth.signOut(); }

        // PATRON
        let patronGuardado, patronActual = [], dibujando = false, modoConfig, patronTemp = null, patronCtx;
        const puntos = document.querySelectorAll('.patron-punto');
        const patronGrid = document.getElementById('patron-grid');
        const patronCanvas = document.getElementById('patron-canvas');

        function initPatron() {
            document.getElementById('patron-screen').classList.add('visible');
            setTimeout(() => {
                const r = patronGrid.getBoundingClientRect();
                patronCanvas.width = r.width;
                patronCanvas.height = r.height;
                patronCtx = patronCanvas.getContext('2d');
            }, 100);
            patronGuardado = localStorage.getItem('patron_agenda');
            modoConfig = !patronGuardado;
            patronTemp = null;
            document.getElementById('patron-modo').textContent = modoConfig ? 'Crea tu patrón (4+ puntos)' : 'Dibuja tu patrón';
            document.getElementById('patron-mensaje').textContent = modoConfig ? 'Conecta al menos 4 puntos' : '';
            patronGrid.onmousedown = patronGrid.ontouchstart = startDraw;
            patronGrid.onmousemove = patronGrid.ontouchmove = moveDraw;
            patronGrid.onmouseup = patronGrid.ontouchend = patronGrid.onmouseleave = endDraw;
        }

        function getCoords(e) {
            const r = patronGrid.getBoundingClientRect();
            if (e.touches) return {x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top};
            return {x: e.clientX - r.left, y: e.clientY - r.top};
        }

        function getPunto(x, y) {
            for (let p of puntos) {
                const r = p.getBoundingClientRect();
                const gr = patronGrid.getBoundingClientRect();
                const cx = r.left - gr.left + r.width/2;
                const cy = r.top - gr.top + r.height/2;
                if (Math.sqrt((x-cx)**2 + (y-cy)**2) < 40) return parseInt(p.dataset.index);
            }
            return -1;
        }

        function getCentro(i) {
            const p = puntos[i];
            const r = p.getBoundingClientRect();
            const gr = patronGrid.getBoundingClientRect();
            return {x: r.left - gr.left + r.width/2, y: r.top - gr.top + r.height/2};
        }

        function startDraw(e) {
            e.preventDefault();
            dibujando = true;
            patronActual = [];
            if (patronCtx) patronCtx.clearRect(0, 0, patronCanvas.width, patronCanvas.height);
            puntos.forEach(p => p.classList.remove('activo'));
            const c = getCoords(e);
            const pt = getPunto(c.x, c.y);
            if (pt >= 0) { patronActual.push(pt); puntos[pt].classList.add('activo'); }
        }

        function moveDraw(e) {
            if (!dibujando) return;
            e.preventDefault();
            const c = getCoords(e);
            const pt = getPunto(c.x, c.y);
            if (pt >= 0 && !patronActual.includes(pt)) {
                patronActual.push(pt);
                puntos[pt].classList.add('activo');
            }
            drawLines(c);
        }

        function endDraw() {
            if (!dibujando) return;
            dibujando = false;
            drawLines();
            validatePatron();
        }

        function drawLines(cur = null) {
            if (!patronCtx) return;
            patronCtx.clearRect(0, 0, patronCanvas.width, patronCanvas.height);
            if (!patronActual.length) return;
            patronCtx.strokeStyle = '#6366f1';
            patronCtx.lineWidth = 4;
            patronCtx.lineCap = 'round';
            patronCtx.beginPath();
            const s = getCentro(patronActual[0]);
            patronCtx.moveTo(s.x, s.y);
            for (let i = 1; i < patronActual.length; i++) {
                const c = getCentro(patronActual[i]);
                patronCtx.lineTo(c.x, c.y);
            }
            if (cur && dibujando) patronCtx.lineTo(cur.x, cur.y);
            patronCtx.stroke();
        }

        function validatePatron() {
            const msg = document.getElementById('patron-mensaje');
            if (modoConfig) {
                if (patronActual.length >= 4) {
                    if (!patronTemp) {
                        patronTemp = patronActual.join('-');
                        msg.textContent = '✓ Dibújalo de nuevo';
                        msg.style.color = '#4ade80';
                        setTimeout(() => {
                            patronActual = [];
                            if (patronCtx) patronCtx.clearRect(0, 0, patronCanvas.width, patronCanvas.height);
                            puntos.forEach(p => p.classList.remove('activo'));
                        }, 1000);
                    } else if (patronActual.join('-') === patronTemp) {
                        localStorage.setItem('patron_agenda', patronTemp);
                        msg.textContent = '✓ ¡Guardado!';
                        msg.style.color = '#4ade80';
                        setTimeout(unlock, 500);
                    } else {
                        msg.textContent = '✗ No coinciden';
                        msg.style.color = '#f87171';
                        patronTemp = null;
                        setTimeout(() => {
                            patronActual = [];
                            if (patronCtx) patronCtx.clearRect(0, 0, patronCanvas.width, patronCanvas.height);
                            puntos.forEach(p => p.classList.remove('activo'));
                            msg.textContent = 'Conecta al menos 4 puntos';
                            msg.style.color = '#fbbf24';
                        }, 1500);
                    }
                } else {
                    msg.textContent = 'Mínimo 4 puntos';
                    msg.style.color = '#fbbf24';
                }
            } else {
                if (patronActual.join('-') === patronGuardado) {
                    msg.textContent = '✓ Desbloqueado';
                    msg.style.color = '#4ade80';
                    setTimeout(unlock, 300);
                } else {
                    msg.textContent = '✗ Incorrecto';
                    msg.style.color = '#f87171';
                    setTimeout(() => {
                        patronActual = [];
                        if (patronCtx) patronCtx.clearRect(0, 0, patronCanvas.width, patronCanvas.height);
                        puntos.forEach(p => p.classList.remove('activo'));
                        msg.textContent = '';
                    }, 1000);
                }
            }
        }

        function unlock() {

        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('visible');
            document.querySelector('.sidebar-overlay').classList.toggle('visible');

        // CARGAR TODO
        async function cargarTodo() {
            // Cargar tabs
            const snapTabs = await db.collection('tabs').where('usuarioId', '==', usuario.uid).get();
            tabs = [];
            snapTabs.forEach(d => tabs.push({id: d.id, ...d.data()}));
            
            if (tabs.length === 0) {
                await db.collection('tabs').add({nombre: 'Pagos', icono: '💳', tipo: 'pagos', orden: 0, usuarioId: usuario.uid});
                await db.collection('tabs').add({nombre: 'Notas', icono: '📋', tipo: 'notas', orden: 1, usuarioId: usuario.uid});
                await db.collection('tabs').add({nombre: 'Proyectos', icono: '💼', tipo: 'proyectos', orden: 2, usuarioId: usuario.uid});
                await db.collection('tabs').add({nombre: 'Tareas', icono: '✅', tipo: 'tareas', orden: 3, usuarioId: usuario.uid});
                return cargarTodo();
            }
            
            // Arreglar tabs sin tipo
            for (const t of tabs) {
                if (!t.tipo) {
                    let tipo = 'notas';
                    if (t.nombre.toLowerCase().includes('pago')) tipo = 'pagos';
                    else if (t.nombre.toLowerCase().includes('proyecto')) tipo = 'proyectos';
                    else if (t.nombre.toLowerCase().includes('tarea')) tipo = 'tareas';
                    await db.collection('tabs').doc(t.id).update({tipo: tipo});
                    t.tipo = tipo;
                }
            }
            
            tabs.sort((a, b) => (a.orden || 0) - (b.orden || 0));
            
            // Cargar todos los items
            const snapItems = await db.collection('items').where('usuarioId', '==', usuario.uid).get();
            allItems = [];
            snapItems.forEach(d => allItems.push({id: d.id, ...d.data()}));
            
            renderSidebar();
            mostrarInicio();
        }

        function contarPendientes(tabId, tipo) {
            const itemsTab = allItems.filter(i => i.tabId === tabId);
            if (tipo === 'pagos') {
                return itemsTab.filter(i => !i.pagadoEsteMes).length;
            } else if (tipo === 'tareas') {
                return itemsTab.filter(i => !i.completada).length;
            } else if (tipo === 'proyectos') {
                return itemsTab.filter(i => i.estado !== 'completado').length;
            } else {
                return itemsTab.length;
            }
        }

                    <span class="icon">${t.icono}</span>
                    <span class="name">${t.nombre}</span>

            menu.innerHTML = html;
        }

        function abrirTab(tabId) {
            tabActiva = tabId;
            vistaActual = 'detalle';
            itemsSeleccionados.clear();
            closeSidebar();
            
            document.getElementById('menu-btn').style.display = 'none';
            document.getElementById('back-btn').style.display = 'block';
            document.getElementById('btn-add').classList.add('visible');
            document.getElementById('btn-share').classList.remove('visible');
            
            const tab = tabs.find(t => t.id === tabId);
            document.getElementById('topbar-title').textContent = tab.nombre;
            
            items = allItems.filter(i => i.tabId === tabId);
            renderDetalle();
        }

        function volverInicio() {
            cargarTodo();
        }

        function renderDetalle() {
            const tab = tabs.find(t => t.id === tabActiva);
            if (!tab) return;
            
            const tipo = tab.tipo || 'notas';
            let html = '';
            
            // Barra de selección
            if (items.length > 0) {
                const todosSeleccionados = items.length > 0 && items.every(i => itemsSeleccionados.has(i.id));
                html += `<div class="select-bar">
                    <label>
                        <div class="item-checkbox ${todosSeleccionados ? 'checked' : ''}" onclick="toggleSeleccionarTodos()">${todosSeleccionados ? '✓' : ''}</div>
                        Seleccionar todos
                    </label>
                    <span class="select-count">${itemsSeleccionados.size} seleccionado${itemsSeleccionados.size !== 1 ? 's' : ''}</span>
                </div>`;
            }
            
            if (tipo === 'pagos') {
                const totalMes = items.reduce((s, i) => s + (parseFloat(i.monto) || 0), 0);
                const pendientes = items.filter(i => !i.pagadoEsteMes);
                const totalPendiente = pendientes.reduce((s, i) => s + (parseFloat(i.monto) || 0), 0);
                
                html += `<div class="stats-bar">
                    <div class="stat-card total"><div class="stat-label">Total mensual</div><div class="stat-value">$${totalMes.toLocaleString()}</div></div>
                    <div class="stat-card pendiente"><div class="stat-label">Pendiente</div><div class="stat-value">$${totalPendiente.toLocaleString()}</div></div>
                </div>`;
                
                if (items.length === 0) {
                    html += '<div class="item-empty"><div class="icon">💳</div><p>Sin pagos registrados</p></div>';
                } else {
                    const sorted = [...items].sort((a, b) => diasRestantes(a.dia) - diasRestantes(b.dia));
                    html += '<div class="item-list">' + sorted.map(renderPago).join('') + '</div>';
                }
            } else if (tipo === 'notas') {
                if (items.length === 0) {
                    html += '<div class="item-empty"><div class="icon">📋</div><p>Sin notas</p></div>';
                } else {
                    const sorted = [...items].sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0));
                    html += '<div class="item-list">' + sorted.map(renderNota).join('') + '</div>';
                }
            } else if (tipo === 'proyectos') {
                if (items.length === 0) {
                    html += '<div class="item-empty"><div class="icon">💼</div><p>Sin proyectos</p></div>';
                } else {
                    html += '<div class="item-list">' + items.map(renderProyecto).join('') + '</div>';
                }
            } else if (tipo === 'tareas') {
                if (items.length === 0) {
                    html += '<div class="item-empty"><div class="icon">✅</div><p>Sin tareas</p></div>';
                } else {
                    const sorted = [...items].sort((a, b) => (a.completada ? 1 : 0) - (b.completada ? 1 : 0));
                    html += '<div class="item-list">' + sorted.map(renderTarea).join('') + '</div>';
                }
            }
            
            document.getElementById('content').innerHTML = html;
            actualizarBotonCompartir();
        }
        
        function toggleSeleccionarTodos() {
            const todosSeleccionados = items.every(i => itemsSeleccionados.has(i.id));
            if (todosSeleccionados) {
                items.forEach(i => itemsSeleccionados.delete(i.id));
            } else {
                items.forEach(i => itemsSeleccionados.add(i.id));
            }
            renderDetalle();
        }
        
        function toggleSeleccionItem(id) {
            if (itemsSeleccionados.has(id)) {
                itemsSeleccionados.delete(id);
            } else {
                itemsSeleccionados.add(id);
            }
            renderDetalle();
        }
        
        function actualizarBotonCompartir() {
            const btn = document.getElementById('btn-share');
            if (itemsSeleccionados.size > 0) {
                btn.classList.add('visible');
                btn.innerHTML = `📤 Compartir (${itemsSeleccionados.size})`;
            } else {
                btn.classList.remove('visible');
            }
        }
        
        function compartirSeleccionados() {
            const tab = tabs.find(t => t.id === tabActiva);
            if (!tab) return;
            
            const tipo = tab.tipo || 'notas';
            const itemsParaCompartir = items.filter(i => itemsSeleccionados.has(i.id));
            
            let texto = `📋 *${tab.nombre}*\n\n`;
            
            itemsParaCompartir.forEach((item, index) => {
                if (tipo === 'pagos') {
                    texto += `💳 *${item.nombre}*\n`;
                    texto += `   📅 Día ${item.dia} del mes\n`;
                    texto += `   💵 $${parseFloat(item.monto || 0).toLocaleString()}\n`;
                    if (item.cuenta) texto += `   🔢 ${item.cuenta}\n`;
                    if (item.notas) texto += `   📝 ${item.notas}\n`;
                    texto += item.pagadoEsteMes ? `   ✅ Pagado\n` : `   ⏳ Pendiente\n`;
                } else if (tipo === 'notas') {
                    texto += `📋 *${item.titulo}*\n`;
                    if (item.descripcion) texto += `   ${item.descripcion}\n`;
                } else if (tipo === 'proyectos') {
                    const estados = {pendiente: '⏳ Pendiente', progreso: '🔄 En progreso', completado: '✅ Completado'};
                    texto += `💼 *${item.nombre}*\n`;
                    if (item.descripcion) texto += `   ${item.descripcion}\n`;
                    texto += `   ${estados[item.estado] || estados.pendiente}\n`;
                } else if (tipo === 'tareas') {
                    texto += item.completada ? `✅` : `⬜`;
                    texto += ` ${item.titulo}\n`;
                    if (item.fechaLimite) texto += `   📅 ${new Date(item.fechaLimite).toLocaleDateString('es-MX')}\n`;
                }
                texto += '\n';
            });
            
            texto += `\n_Enviado desde Mi Agenda_`;
            
            const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function diasRestantes(dia) {
            const hoy = new Date();
            const d = hoy.getDate();
            const m = hoy.getMonth();
            const a = hoy.getFullYear();
            let fecha = new Date(a, m, dia);
            if (dia <= d) fecha = new Date(a, m + 1, dia);
            return Math.ceil((fecha - hoy) / (1000 * 60 * 60 * 24));
        }

        function renderPago(p) {
            const dr = diasRestantes(p.dia);
            let clase = '', badge = '';
            const seleccionado = itemsSeleccionados.has(p.id);
            
            if (p.pagadoEsteMes) {
                clase = 'pagado';
                badge = '<span class="card-badge badge-pagado">✓ Pagado</span>';
            } else if (dr <= 0) {
                clase = 'urgente';
                badge = '<span class="card-badge badge-hoy">¡HOY!</span>';
            } else if (dr <= 3) {
                clase = 'proximo';
                badge = `<span class="card-badge badge-pronto">${dr} días</span>`;
            } else {
                badge = `<span class="card-badge badge-bien">${dr} días</span>`;
            }
            
            return `<div class="card ${clase} card-selectable">
                <div class="item-checkbox ${seleccionado ? 'checked' : ''}" onclick="toggleSeleccionItem('${p.id}')">${seleccionado ? '✓' : ''}</div>
                <div class="card-content">
                    <div class="card-header">
                        <span class="card-titulo">💳 ${p.nombre}</span>
                        <span class="card-monto">$${parseFloat(p.monto || 0).toLocaleString()}</span>
                    </div>
                    <div class="card-info">📅 Día ${p.dia} de cada mes ${badge}</div>
                    ${p.cuenta ? `<div class="card-cuenta" onclick="copiar('${p.cuenta}')"><div class="card-cuenta-label">CUENTA</div><div class="card-cuenta-num">${p.cuenta} 📋</div></div>` : ''}
                    ${p.notas ? `<div class="card-notas">💡 ${p.notas}</div>` : ''}
                    <div class="card-actions">
                        ${!p.pagadoEsteMes ? `<button class="card-btn btn-pagar" onclick="marcarPagado('${p.id}')">✓ Pagado</button>` : ''}
                        <button class="card-btn btn-historial" onclick="verHistorial('${p.id}')">📊</button>
                        <button class="card-btn btn-edit" onclick="editarItem('${p.id}')">✏️</button>
                        <button class="card-btn btn-del" onclick="eliminarItem('${p.id}')">🗑️</button>
                    </div>
                </div>
            </div>`;
        }

        function renderNota(n) {
            const fecha = n.fecha ? new Date(n.fecha).toLocaleDateString('es-MX') : '';
            const seleccionado = itemsSeleccionados.has(n.id);
            return `<div class="card card-selectable" style="border-left-color:#ec4899">
                <div class="item-checkbox ${seleccionado ? 'checked' : ''}" onclick="toggleSeleccionItem('${n.id}')">${seleccionado ? '✓' : ''}</div>
                <div class="card-content">
                    <div class="card-titulo">${n.titulo}</div>
                    ${n.descripcion ? `<div class="card-desc">${n.descripcion}</div>` : ''}
                    <div class="card-fecha">📅 ${fecha}</div>
                    <div class="card-actions">
                        <button class="card-btn btn-edit" onclick="editarItem('${n.id}')">✏️</button>
                        <button class="card-btn btn-del" onclick="eliminarItem('${n.id}')">🗑️</button>
                    </div>
                </div>
            </div>`;
        }

        function renderProyecto(p) {
            const badges = {
                pendiente: '<span class="card-badge badge-pendiente">Pendiente</span>',
                progreso: '<span class="card-badge badge-progreso">En progreso</span>',
                completado: '<span class="card-badge badge-completado">Completado</span>'
            };
            const seleccionado = itemsSeleccionados.has(p.id);
            return `<div class="card card-selectable" style="border-left-color:#8b5cf6">
                <div class="item-checkbox ${seleccionado ? 'checked' : ''}" onclick="toggleSeleccionItem('${p.id}')">${seleccionado ? '✓' : ''}</div>
                <div class="card-content">
                    <div class="card-header">
                        <span class="card-titulo">${p.nombre}</span>
                        ${badges[p.estado] || badges.pendiente}
                    </div>
                    ${p.descripcion ? `<div class="card-desc">${p.descripcion}</div>` : ''}
                    <div class="card-actions">
                        <button class="card-btn btn-edit" onclick="editarItem('${p.id}')">✏️</button>
                        <button class="card-btn btn-del" onclick="eliminarItem('${p.id}')">🗑️</button>
                    </div>
                </div>
            </div>`;
        }

        function renderTarea(t) {
            const seleccionado = itemsSeleccionados.has(t.id);
            return `<div class="card card-selectable" style="border-left-color:#22c55e;${t.completada ? 'opacity:0.6' : ''}">
                <div class="item-checkbox ${seleccionado ? 'checked' : ''}" onclick="toggleSeleccionItem('${t.id}')">${seleccionado ? '✓' : ''}</div>
                <div class="card-content">
                    <div style="display:flex;align-items:center;gap:0.75rem">
                        <div class="tarea-check ${t.completada ? 'checked' : ''}" onclick="toggleTarea('${t.id}')">${t.completada ? '✓' : ''}</div>
                        <div class="tarea-content">
                            <div class="tarea-titulo" style="${t.completada ? 'text-decoration:line-through;color:#64748b' : ''}">${t.titulo}</div>
                            ${t.fechaLimite ? `<div class="tarea-fecha">📅 ${new Date(t.fechaLimite).toLocaleDateString('es-MX')}</div>` : ''}
                        </div>
                    </div>
                    <div class="card-actions" style="margin-top:0.5rem">
                        <button class="card-btn btn-edit" onclick="editarItem('${t.id}')">✏️</button>
                        <button class="card-btn btn-del" onclick="eliminarItem('${t.id}')">🗑️</button>
                    </div>
                </div>
            </div>`;
        }

        // MODAL TAB
        function abrirModalTab(tab = null) {
            editandoTab = tab;
            document.getElementById('modal-tab-titulo').textContent = tab ? '✏️ Editar' : '📁 Nueva Categoría';
            document.getElementById('tab-nombre').value = tab ? tab.nombre : '';
            tabIconoSel = tab ? tab.icono : '💳';
            tabTipoSel = tab ? (tab.tipo || 'notas') : 'pagos';
            renderTabIconos();
            renderTiposBtns();
            
            let actionsHtml = `<button class="modal-btn btn-cancel" onclick="cerrarModalTab()">Cancelar</button>`;
            if (tab) actionsHtml += `<button class="modal-btn btn-delete" onclick="eliminarTab()">🗑️</button>`;
            actionsHtml += `<button class="modal-btn btn-save" onclick="guardarTab()">Guardar</button>`;
            document.getElementById('modal-tab-actions').innerHTML = actionsHtml;
            
            document.getElementById('modal-tab').classList.add('visible');
            closeSidebar();
        }

        function cerrarModalTab() {
            document.getElementById('modal-tab').classList.remove('visible');
        }

        function renderTabIconos() {
            document.getElementById('tab-icon-grid').innerHTML = iconosTabs.map(i => 
                `<button type="button" class="icon-btn ${i === tabIconoSel ? 'active' : ''}" onclick="selTabIcono('${i}')">${i}</button>`
            ).join('');
        }

        function selTabIcono(i) {
            tabIconoSel = i;
            renderTabIconos();
        }

        function renderTiposBtns() {
            document.getElementById('tipo-grid').innerHTML = tiposDisponibles.map(t =>
                `<div class="tipo-btn ${t.id === tabTipoSel ? 'active' : ''}" onclick="selTipo('${t.id}')">
                    <div class="icon">${t.icono}</div>
                    <div class="name">${t.nombre}</div>
                </div>`
            ).join('');
        }

        function selTipo(t) {
            tabTipoSel = t;
            renderTiposBtns();
        }

        async function guardarTab() {
            const nombre = document.getElementById('tab-nombre').value.trim();
            if (!nombre) { toast('⚠️ Escribe un nombre'); return; }
            
            const data = {
                nombre: nombre,
                icono: tabIconoSel,
                tipo: tabTipoSel,
                usuarioId: usuario.uid
            };
            
            if (editandoTab) {
                await db.collection('tabs').doc(editandoTab.id).update(data);
            } else {
                data.orden = tabs.length;
                await db.collection('tabs').add(data);
            }
            
            cerrarModalTab();
            cargarTodo();
            toast('✓ Guardado');
        }

        async function eliminarTab() {
            if (tabs.length <= 1) { toast('⚠️ Necesitas al menos una'); return; }
            if (!confirm('¿Eliminar esta categoría y todo su contenido?')) return;
            
            const itemsSnap = await db.collection('items').where('tabId', '==', editandoTab.id).get();
            const batch = db.batch();
            itemsSnap.forEach(doc => batch.delete(doc.ref));
            batch.delete(db.collection('tabs').doc(editandoTab.id));
            await batch.commit();
            
            cerrarModalTab();
            cargarTodo();
            toast('✓ Eliminado');
        }

        // MODAL ITEM
        function abrirModalItem(item = null) {
            editandoItem = item;
            const tab = tabs.find(t => t.id === tabActiva);
            if (!tab) { toast('⚠️ Selecciona una categoría'); return; }
            
            const tipo = tab.tipo || 'notas';
            let html = '';
            
            if (tipo === 'pagos') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nuevo'} Pago</h2>
                    <div class="form-group">
                        <label class="form-label">Nombre del pago</label>
                        <input type="text" class="form-input" id="item-nombre" value="${item?.nombre || ''}" placeholder="Ej: Luz, Internet, Renta...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Día del mes</label>
                        <input type="number" class="form-input" id="item-dia" min="1" max="31" value="${item?.dia || new Date().getDate()}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Monto $</label>
                        <input type="number" class="form-input" id="item-monto" value="${item?.monto || ''}" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Número de cuenta (opcional)</label>
                        <input type="text" class="form-input" id="item-cuenta" value="${item?.cuenta || ''}" placeholder="Referencia o cuenta">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Notas (opcional)</label>
                        <textarea class="form-input" id="item-notas" placeholder="Notas adicionales...">${item?.notas || ''}</textarea>
                    </div>`;
            } else if (tipo === 'notas') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nueva'} Nota</h2>
                    <div class="form-group">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-input" id="item-titulo" value="${item?.titulo || ''}" placeholder="Título de la nota">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-input" id="item-desc" placeholder="Escribe tu nota aquí..." style="min-height:150px">${item?.descripcion || ''}</textarea>
                    </div>`;
            } else if (tipo === 'proyectos') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nuevo'} Proyecto</h2>
                    <div class="form-group">
                        <label class="form-label">Nombre del proyecto</label>
                        <input type="text" class="form-input" id="item-nombre" value="${item?.nombre || ''}" placeholder="Nombre del proyecto">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-input" id="item-desc" placeholder="Descripción del proyecto...">${item?.descripcion || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <select class="form-select" id="item-estado">
                            <option value="pendiente" ${item?.estado === 'pendiente' || !item ? 'selected' : ''}>Pendiente</option>
                            <option value="progreso" ${item?.estado === 'progreso' ? 'selected' : ''}>En progreso</option>
                            <option value="completado" ${item?.estado === 'completado' ? 'selected' : ''}>Completado</option>
                        </select>
                    </div>`;
            } else if (tipo === 'tareas') {
                html = `<h2>${item ? '✏️ Editar' : '➕ Nueva'} Tarea</h2>
                    <div class="form-group">
                        <label class="form-label">¿Qué necesitas hacer?</label>
                        <input type="text" class="form-input" id="item-titulo" value="${item?.titulo || ''}" placeholder="Describe la tarea">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha límite (opcional)</label>
                        <input type="date" class="form-input" id="item-fecha" value="${item?.fechaLimite || ''}">
                    </div>`;
            }
            
            html += `<div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="cerrarModalItem()">Cancelar</button>
                <button class="modal-btn btn-save" onclick="guardarItem()">Guardar</button>
            </div>`;
            
            document.getElementById('modal-item-content').innerHTML = html;
            document.getElementById('modal-item').classList.add('visible');
        }

        function cerrarModalItem() {
            document.getElementById('modal-item').classList.remove('visible');
            editandoItem = null;
        }

        function editarItem(id) {
            const item = items.find(i => i.id === id);
            abrirModalItem(item);
        }

        async function guardarItem() {
            const tab = tabs.find(t => t.id === tabActiva);
            if (!tab) return;
            
            const tipo = tab.tipo || 'notas';
            let data = {tabId: tabActiva, usuarioId: usuario.uid};
            
            if (tipo === 'pagos') {
                const nombre = document.getElementById('item-nombre').value.trim();
                if (!nombre) { toast('⚠️ Escribe el nombre'); return; }
                data.nombre = nombre;
                data.dia = parseInt(document.getElementById('item-dia').value) || 1;
                data.monto = document.getElementById('item-monto').value || '0';
                data.cuenta = document.getElementById('item-cuenta').value.trim();
                data.notas = document.getElementById('item-notas').value.trim();
                if (editandoItem) {
                    data.pagadoEsteMes = editandoItem.pagadoEsteMes || false;
                    data.historial = editandoItem.historial || [];
                }
            } else if (tipo === 'notas') {
                const titulo = document.getElementById('item-titulo').value.trim();
                if (!titulo) { toast('⚠️ Escribe el título'); return; }
                data.titulo = titulo;
                data.descripcion = document.getElementById('item-desc').value.trim();
                data.fecha = new Date().toISOString();
            } else if (tipo === 'proyectos') {
                const nombre = document.getElementById('item-nombre').value.trim();
                if (!nombre) { toast('⚠️ Escribe el nombre'); return; }
                data.nombre = nombre;
                data.descripcion = document.getElementById('item-desc').value.trim();
                data.estado = document.getElementById('item-estado').value;
            } else if (tipo === 'tareas') {
                const titulo = document.getElementById('item-titulo').value.trim();
                if (!titulo) { toast('⚠️ Escribe la tarea'); return; }
                data.titulo = titulo;
                data.fechaLimite = document.getElementById('item-fecha').value;
                data.completada = editandoItem?.completada || false;
            }
            
            try {
                if (editandoItem) {
                    await db.collection('items').doc(editandoItem.id).update(data);
                } else {
                    await db.collection('items').add(data);
                }
                cerrarModalItem();
                // Recargar items
                const snapItems = await db.collection('items').where('usuarioId', '==', usuario.uid).get();
                allItems = [];
                snapItems.forEach(d => allItems.push({id: d.id, ...d.data()}));
                items = allItems.filter(i => i.tabId === tabActiva);
                renderSidebar();
                renderDetalle();
                toast('✓ Guardado');
            } catch (e) {
                console.error(e);
                toast('❌ Error al guardar');
            }
        }

        async function eliminarItem(id) {
            if (!confirm('¿Eliminar?')) return;
            await db.collection('items').doc(id).delete();
            const snapItems = await db.collection('items').where('usuarioId', '==', usuario.uid).get();
            allItems = [];
            snapItems.forEach(d => allItems.push({id: d.id, ...d.data()}));
            items = allItems.filter(i => i.tabId === tabActiva);
            renderSidebar();
            renderDetalle();
            toast('✓ Eliminado');
        }

        async function toggleTarea(id) {
            const t = items.find(i => i.id === id);
            await db.collection('items').doc(id).update({completada: !t.completada});
            const snapItems = await db.collection('items').where('usuarioId', '==', usuario.uid).get();
            allItems = [];
            snapItems.forEach(d => allItems.push({id: d.id, ...d.data()}));
            items = allItems.filter(i => i.tabId === tabActiva);
            renderSidebar();
            renderDetalle();
        }

        async function marcarPagado(id) {
            const p = items.find(i => i.id === id);
            const historial = p.historial || [];
            historial.push({fecha: new Date().toISOString(), monto: p.monto});
            await db.collection('items').doc(id).update({pagadoEsteMes: true, historial: historial});
            const snapItems = await db.collection('items').where('usuarioId', '==', usuario.uid).get();
            allItems = [];
            snapItems.forEach(d => allItems.push({id: d.id, ...d.data()}));
            items = allItems.filter(i => i.tabId === tabActiva);
            renderSidebar();
            renderDetalle();
            toast('✓ Marcado como pagado');
        }

        function verHistorial(id) {
            const p = items.find(i => i.id === id);
            const hist = p.historial || [];
            let html = '';
            if (hist.length === 0) {
                html = '<p style="text-align:center;color:#64748b">Sin historial de pagos</p>';
            } else {
                html = hist.slice().reverse().map(h => 
                    `<div class="historial-item">
                        <span class="historial-fecha">${new Date(h.fecha).toLocaleDateString('es-MX')}</span>
                        <span class="historial-monto">$${parseFloat(h.monto || 0).toLocaleString()}</span>
                    </div>`
                ).join('');
            }
            document.getElementById('historial-list').innerHTML = html;
            document.getElementById('modal-historial').classList.add('visible');
        }

        function cerrarHistorial() {
            document.getElementById('modal-historial').classList.remove('visible');
        }

        // UTILS
        function copiar(texto) {
            navigator.clipboard.writeText(texto);
            toast('📋 Copiado');
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2500);
        }

        function mostrarFecha() {
            document.getElementById('fecha-hoy').textContent = new Date().toLocaleDateString('es-MX', {
                weekday: 'long', day: 'numeric', month: 'long'
            });
        }

        // Reset pagos cada mes
        setInterval(async () => {
            const hoy = new Date();
            const mesKey = `${hoy.getFullYear()}-${hoy.getMonth()}`;
            const ultimoReset = localStorage.getItem('ultimoResetPagos');
            if (ultimoReset !== mesKey && usuario) {
                const snap = await db.collection('items').where('usuarioId', '==', usuario.uid).get();
                const batch = db.batch();
                snap.forEach(doc => {
                    if (doc.data().pagadoEsteMes) {
                        batch.update(doc.ref, {pagadoEsteMes: false});
                    }
                });
                await batch.commit();
                localStorage.setItem('ultimoResetPagos', mesKey);
            }
        }, 60000);

        document.getElementById('login-password').onkeypress = e => { if (e.key === 'Enter') iniciarSesion(); };
    </script>
</body>
</html>
